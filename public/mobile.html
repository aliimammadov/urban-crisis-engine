<!doctype html>
<html lang="az">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg">
<link rel="apple-touch-icon" href="/icon.svg">
<title>SOS</title>
<link rel="stylesheet" href="/vendor/leaflet.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Plus+Jakarta+Sans:wght@700;800&amp;display=swap">
<script src="/vendor/leaflet.js"></script>
<style>
  :root { --ink:#0b0b0f; --muted:#5f6470; --soft:#f4f5f7; --line:#e4e5ea; --blue:#0071e3; --green:#1a9e55; --green-ink:#0b7a42; --red:#ff3b30; --red-ink:#b4231a; --amber-bg:#fff4de; --amber-ink:#6b3f00;
          --head:'Plus Jakarta Sans','Inter',system-ui,-apple-system,Segoe UI,Roboto,sans-serif; --body:'Inter',system-ui,-apple-system,Segoe UI,Roboto,sans-serif; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; height:100%; background:var(--soft); color:var(--ink); font:15px/1.4 var(--body); overscroll-behavior:none; }
  button { font:inherit; color:inherit; cursor:pointer; }
  #app { position:relative; max-width:430px; height:100dvh; margin:0 auto; background:#fff; overflow:hidden; }
  .screen { display:none; position:absolute; inset:0; }
  #app[data-screen="home"] #home, #app[data-screen="route"] #route, #app[data-screen="sent"] #sent { display:flex; }

  /* ---- home ---- */
  #home { flex-direction:column; padding:max(16px,env(safe-area-inset-top)) 16px max(20px,env(safe-area-inset-bottom)); overflow-y:auto; }
  .topbar { display:flex; align-items:center; justify-content:space-between; gap:8px; }
  .chip { position:relative; display:flex; align-items:center; gap:8px; background:var(--soft); border-radius:999px; padding:0 14px; height:48px; font-size:13px; color:#3d4350; min-width:0; }
  .chip select { position:absolute; inset:0; width:100%; opacity:0; font-size:16px; }
  .dot { width:8px; height:8px; border-radius:50%; background:var(--green); flex:none; } .dot.warn { background:#e8a100; } .dot.off { background:var(--red); }
  .safebtn { position:relative; height:48px; border:1.5px solid #bfe3cd; background:#fff; color:var(--green-ink); border-radius:999px; padding:0 16px 0 8px; display:flex; align-items:center; gap:10px; text-align:left; touch-action:none; user-select:none; -webkit-user-select:none; }
  .safebtn .ring-bg { stroke:#e1f3e8; } .safebtn .ring { stroke:var(--green); stroke-dasharray:82; stroke-dashoffset:82; }
  .safebtn.holding .ring { stroke-dashoffset:0; transition:stroke-dashoffset 1.5s linear; }
  .safebtn b { display:block; font:700 14px var(--head); line-height:1.15; } .safebtn small { display:block; font-size:11px; color:var(--muted); }
  h1 { margin:34px 0 0; font:800 40px/1.02 var(--head); letter-spacing:-0.05em; }
  .lead { margin:10px 0 0; font-size:15px; line-height:1.4; color:#3d4350; }
  .tiles { margin-top:22px; display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px; }
  .tile { border:0; border-radius:22px; height:132px; padding:16px; display:flex; flex-direction:column; align-items:flex-start; justify-content:space-between; font:700 19px var(--head); letter-spacing:-0.02em; text-align:left; transition:transform .08s; }
  .tile:active { transform:scale(.97); }
  .spacer { flex-grow:1; min-height:16px; }
  .saferow { display:flex; align-items:center; gap:14px; border:1px solid var(--line); border-radius:20px; padding:14px 16px; background:#fff; width:100%; text-align:left; }
  .saferow .ic { width:46px; height:46px; border-radius:14px; background:#e6f6ec; display:flex; align-items:center; justify-content:center; flex:none; }
  .saferow .t { font:700 16px var(--head); letter-spacing:-0.02em; } .saferow .s { font-size:13.5px; color:var(--muted); margin-top:2px; }
  .saferow .s.amber { color:#9a5b00; font-weight:600; }
  .foot { margin-top:12px; display:flex; align-items:center; justify-content:center; gap:8px; font-size:12.5px; color:var(--muted); text-align:center; }
  .langs { display:flex; justify-content:center; gap:4px; margin-top:8px; }
  .langs button { border:0; background:none; color:var(--muted); padding:6px 10px; font-size:13px; border-radius:999px; } .langs button.on { background:var(--soft); color:var(--ink); font-weight:600; }

  /* ---- route ---- */
  #route { flex-direction:column; }
  #map { position:absolute; inset:0 0 0 0; background:#eaf0f7; }
  .float { position:absolute; left:14px; right:14px; z-index:1100; }
  .fbtn { width:48px; height:48px; border:0; border-radius:50%; background:#fff; display:flex; align-items:center; justify-content:center; box-shadow:0 2px 10px rgba(11,11,15,.14); flex:none; }
  .ftitle { flex-grow:1; background:#fff; border-radius:999px; height:48px; display:flex; align-items:center; justify-content:center; font:700 15px var(--head); box-shadow:0 2px 10px rgba(11,11,15,.14); }
  .banner { background:var(--amber-bg); color:var(--amber-ink); border-radius:14px; padding:10px 14px; display:flex; gap:10px; align-items:center; font-size:13px; line-height:1.3; box-shadow:0 2px 10px rgba(11,11,15,.12); }
  .sheet { position:absolute; left:0; right:0; bottom:0; z-index:1100; background:#fff; border-radius:28px 28px 0 0; padding:10px 16px max(24px,env(safe-area-inset-bottom)); display:flex; flex-direction:column; gap:14px; box-shadow:0 -6px 24px rgba(11,11,15,.14); max-height:62%; overflow-y:auto; }
  .grab { width:40px; height:5px; border-radius:3px; background:#d7d9df; align-self:center; flex:none; }
  .eyebrow { font-size:12px; font-weight:600; letter-spacing:.06em; text-transform:uppercase; color:var(--green-ink); }
  .pname { font:800 21px var(--head); letter-spacing:-0.035em; margin-top:4px; } .psub { font-size:13.5px; color:var(--muted); margin-top:2px; }
  .eta { text-align:right; flex:none; } .eta b { display:block; font:800 40px/1 var(--head); letter-spacing:-0.06em; } .eta span { font-size:13px; color:var(--muted); }
  .bar { height:8px; border-radius:4px; background:var(--soft); overflow:hidden; } .bar i { display:block; height:100%; }
  .btnrow { display:flex; gap:8px; }
  .primary { flex:1; height:54px; border:0; border-radius:16px; background:var(--blue); color:#fff; font:700 17px var(--head); display:flex; align-items:center; justify-content:center; gap:8px; text-decoration:none; }
  .secondary:disabled { background:#e6f6ec; border-color:#bfe3cd; color:#0b7a42; cursor:default; }
  .secondary { width:112px; height:54px; border-radius:16px; border:1.5px solid var(--line); background:#fff; font:700 15px var(--head); }
  .alt { display:flex; align-items:center; gap:10px; padding:10px 2px; border-top:1px solid #eef0f3; font-size:14px; } .alt span { flex-grow:1; } .alt small { color:var(--muted); }

  /* ---- sent ---- */
  #sent { flex-direction:column; padding:max(16px,env(safe-area-inset-top)) 16px max(18px,env(safe-area-inset-bottom)); gap:14px; overflow-y:auto; }
  .hero { display:flex; flex-direction:column; align-items:center; text-align:center; gap:10px; padding:14px 0 4px; }
  .hero .badge { width:84px; height:84px; border-radius:50%; background:#e6f6ec; display:flex; align-items:center; justify-content:center; }
  .hero.queued .badge { background:var(--amber-bg); }
  .hero h2 { margin:0; font:800 28px var(--head); letter-spacing:-0.045em; } .hero p { margin:0; font-size:15px; color:var(--muted); max-width:310px; }
  .box { background:var(--soft); border-radius:18px; padding:14px 16px; display:flex; flex-direction:column; gap:10px; }
  .box .hd { display:flex; justify-content:space-between; align-items:center; font:700 16px var(--head); } .box .hd small { font:400 13px var(--body); color:var(--muted); }
  .sep { height:1px; background:var(--line); }
  .step { display:flex; gap:12px; align-items:center; font-size:14.5px; }
  .step .m { width:24px; height:24px; border-radius:50%; border:2px solid #c9ccd4; background:#fff; display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:800; flex:none; }
  .step.done .m { background:var(--green); border-color:var(--green); color:#fff; } .step.now .m { border-color:var(--blue); color:var(--blue); }
  .step.todo { color:var(--muted); } .step .w { flex-grow:1; } .step small { color:var(--muted); font-size:12.5px; } .step.now .w, .step.done .w { font-weight:600; }
  .card { border:1px solid var(--line); border-radius:18px; padding:14px 16px; display:flex; flex-direction:column; gap:8px; }
  .linkbtn { border:0; background:none; color:var(--muted); text-decoration:underline; padding:12px 4px; font-size:13.5px; }
  .miniTop { display:flex; align-items:center; justify-content:space-between; gap:8px; }

  /* ---- overlays ---- */
  #countdown { position:absolute; inset:0; z-index:2000; background:#b4231a; color:#fff; display:none; flex-direction:column; align-items:center; padding:56px 24px 28px; }
  #countdown.on { display:flex; }
  .typechip { display:flex; align-items:center; gap:10px; background:rgba(255,255,255,.16); border-radius:999px; padding:8px 16px; font:700 16px var(--head); }
  #countdown h2 { margin:28px 0 0; font:800 30px/1.1 var(--head); letter-spacing:-0.04em; text-align:center; } #countdown p { margin:8px 0 0; opacity:.9; text-align:center; }
  .ringwrap { position:relative; width:240px; height:240px; margin-top:34px; } .ringwrap svg { transform:rotate(-90deg); }
  #cdRing { transition:none; } #cdRing.run { transition:stroke-dashoffset 3s linear; }
  #cdNum { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font:800 132px var(--head); letter-spacing:-0.06em; }
  .cdinfo { margin-top:30px; background:rgba(0,0,0,.18); border-radius:16px; padding:12px 16px; width:100%; display:flex; flex-direction:column; gap:6px; font-size:14px; }
  .cdinfo div { display:flex; justify-content:space-between; gap:8px; } .cdinfo span { opacity:.8; }
  #cdCancel { width:100%; height:68px; border:0; border-radius:20px; background:#fff; color:#b4231a; font:800 22px var(--head); letter-spacing:-0.02em; }
  .cdnote { font-size:12.5px; opacity:.85; margin-top:12px; text-align:center; }

  #safeOverlay { position:absolute; inset:0; z-index:2100; background:rgba(11,11,15,.55); display:none; align-items:flex-end; }
  #safeOverlay.on { display:flex; }
  .safesheet { width:100%; background:#fff; border-radius:28px 28px 0 0; padding:12px 20px max(28px,env(safe-area-inset-bottom)); display:flex; flex-direction:column; gap:14px; }
  .safesheet h3 { margin:0; font:800 26px/1.1 var(--head); letter-spacing:-0.045em; }
  .warnbox { background:var(--amber-bg); color:var(--amber-ink); border-radius:14px; padding:12px 14px; font-size:14px; line-height:1.45; }
  .track { position:relative; height:68px; border-radius:34px; background:#e6f6ec; border:1.5px solid #bfe3cd; overflow:hidden; touch-action:none; user-select:none; -webkit-user-select:none; }
  .fill { position:absolute; left:0; top:0; bottom:0; width:68px; background:#bfe3cd; border-radius:34px; }
  .thumb { position:absolute; left:6px; top:6px; width:56px; height:56px; border-radius:50%; background:var(--green); display:flex; align-items:center; justify-content:center; box-shadow:0 2px 6px rgba(11,122,66,.35); }
  .track .label { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; padding-left:46px; font:700 16px var(--head); color:#0b6a3a; pointer-events:none; }
  .hint { font-size:12.5px; color:var(--muted); text-align:center; margin-top:-4px; }
  .outline { height:54px; border-radius:16px; border:1.5px solid var(--line); background:#fff; font:700 16px var(--head); }

  #toast { position:absolute; left:14px; right:14px; bottom:calc(14px + env(safe-area-inset-bottom)); z-index:3000; padding:14px; border-radius:14px; background:#0b0b0f; color:#fff; font-weight:600; text-align:center; transform:translateY(160%); transition:transform .25s; pointer-events:none; }
  #toast.show { transform:none; } #toast.err { background:var(--red-ink); }
  .profilerow { margin-top:10px; width:100%; display:flex; align-items:center; gap:12px; border:1px solid var(--line); background:#fff; border-radius:16px; padding:11px 14px; text-align:left; }
  .profilerow .ic { width:36px; height:36px; border-radius:12px; background:var(--soft); display:flex; align-items:center; justify-content:center; flex:none; }
  .profilerow .t { flex-grow:1; font:700 14px var(--head); } .profilerow.on { border-color:#c4b0f5; background:#f6f1ff; } .profilerow.on .ic { background:#e7dcff; }
  .prio { display:inline-flex; align-items:center; gap:6px; background:#ede4ff; color:#43228a; border-radius:999px; padding:4px 12px; font:700 13px var(--head); }
  .accrow { display:flex; flex-wrap:wrap; gap:6px; align-items:center; font-size:12.5px; color:#43228a; }
  .accrow span { background:#f3edff; border-radius:999px; padding:2px 10px; font-weight:600; }
  #profileOverlay { position:absolute; inset:0; z-index:2100; background:rgba(11,11,15,.55); display:none; align-items:flex-end; } #profileOverlay.on { display:flex; }
  #profileOverlay .safesheet { max-height:92%; overflow-y:auto; }
  .opt { display:flex; align-items:center; gap:12px; padding:12px 4px; border-top:1px solid #eef0f3; font-size:15px; } .opt input { width:22px; height:22px; accent-color:#6d3fd8; flex:none; }
  .cdprio { margin-top:10px; background:#fff; color:#43228a; border-radius:999px; padding:6px 14px; font:800 14px var(--head); }
  .bcbanner { margin-top:12px; border-radius:16px; padding:12px 14px; display:flex; flex-direction:column; gap:6px; font-size:14px; line-height:1.4; border:1.5px solid #f2d596; background:var(--amber-bg); color:var(--amber-ink); }
  .bcbanner.info { background:#e6f2fd; border-color:#b9d6f6; color:#0a4f9e; } .bcbanner b { font:800 15px var(--head); letter-spacing:-0.02em; }
  .bcbanner button { align-self:flex-start; border:0; background:rgba(0,0,0,.08); border-radius:10px; padding:7px 14px; font:700 13px var(--head); }
  #bcOverlay { position:absolute; inset:0; z-index:2300; background:rgba(11,11,15,.6); display:none; align-items:flex-end; } #bcOverlay.on { display:flex; }
  #bcOverlay .safesheet { border-top:8px solid #ff3b30; } #bcOverlay .tag { display:inline-block; background:#fdeceb; color:#b4231a; border-radius:999px; padding:3px 12px; font:800 12px var(--head); letter-spacing:.06em; text-transform:uppercase; align-self:flex-start; }
  .smscard { border:1.5px dashed #c9ccd4; border-radius:16px; padding:12px 14px; display:flex; flex-direction:column; gap:8px; font-size:13.5px; color:#3d4350; } .smscard b { font:800 14px var(--head); }
  .smslink { display:inline-flex; align-items:center; justify-content:center; height:46px; border-radius:14px; background:#0b0b0f; color:#fff; font:700 15px var(--head); text-decoration:none; }
  .degbar { border-radius:16px; padding:12px 14px; display:flex; flex-direction:column; gap:4px; background:#2b2f3a; color:#fff; font-size:13px; line-height:1.4; }
  .degbar b { font:800 14.5px var(--head); letter-spacing:-0.02em; display:flex; align-items:center; gap:8px; } .degbar small { color:#cdd3df; font-size:12.5px; } .degbar .dot { background:#ffb020; }
  #degHome { margin-top:12px; }
  [hidden] { display:none !important; }
  @media (min-width:431px) { #app { box-shadow:0 0 0 1px var(--line); } }
</style>
</head>
<body>
<div id="app" data-screen="home">

  <!-- ============ HOME ============ -->
  <section id="home" class="screen" data-i18n-aria="app.title">
    <div class="topbar">
      <label class="chip" id="gpsChip"><span class="dot warn" id="gpsDot"></span><span id="gpsText">GPS…</span>
        <select id="district" data-i18n-aria="ui.district"></select></label>
      <button class="safebtn" id="safeBtn">
        <svg width="32" height="32" viewBox="0 0 32 32" aria-hidden="true"><circle class="ring-bg" cx="16" cy="16" r="13" fill="none" stroke-width="3.5"/><circle class="ring" cx="16" cy="16" r="13" fill="none" stroke-width="3.5" stroke-linecap="round" transform="rotate(-90 16 16)"/><path d="M10.5 16.5l3.8 3.8 7.2-8" fill="none" stroke="#0b7a42" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span><b id="safeLabel"></b><small id="safeHint"></small></span>
      </button>
    </div>
    <div id="degHome"></div>
    <div id="bcBanners"></div>
    <h1 id="hTitle"></h1>
    <p class="lead" id="hLead"></p>
    <div class="tiles" id="tiles"></div>
    <div class="spacer"></div>
    <button class="saferow" id="toRoute">
      <span class="ic"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#0b7a42" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s7-6 7-11a7 7 0 0 0-14 0c0 5 7 11 7 11z"/><circle cx="12" cy="10" r="2.5"/></svg></span>
      <span style="flex-grow:1;min-width:0"><div class="t" id="rowTitle"></div><div class="s" id="rowSub">…</div></span>
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#5f6470" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
    </button>
    <button class="profilerow" id="profileBtn">
      <span class="ic"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#43228a" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="4.5" r="1.8"/><path d="M12 7.5v5h4.5l2 4.5"/><path d="M7.4 11.2a5.4 5.4 0 1 0 8 7"/></svg></span>
      <span class="t" id="profileLabel"></span>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5f6470" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
    </button>
    <div class="foot"><span class="dot" id="netDot"></span><span id="netText"></span></div>
    <div id="smsHome" style="margin-top:10px"></div>
    <div class="langs" id="langs"></div>
  </section>

  <!-- ============ ROUTE ============ -->
  <section id="route" class="screen" data-i18n-aria="m.routeTitle">
    <div id="map"></div>
    <div class="float" style="top:max(16px,env(safe-area-inset-top));display:flex;gap:8px;align-items:center">
      <button class="fbtn" id="back" data-i18n-aria="m.back"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#0b0b0f" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>
      <div class="ftitle" id="routeTitle"></div>
    </div>
    <div class="float" id="routeBanner" style="top:calc(max(16px,env(safe-area-inset-top)) + 58px)" hidden></div>
    <div class="sheet" id="sheet"></div>
  </section>

  <!-- ============ SENT ============ -->
  <section id="sent" class="screen" data-i18n-aria="m.sentTitle"></section>

  <!-- ============ COUNTDOWN ============ -->
  <div id="countdown" role="alertdialog" aria-live="assertive" data-i18n-aria="m.sending">
    <div class="typechip" id="cdType"></div>
    <h2 id="cdTitle"></h2><p id="cdHelp"></p>
    <div class="ringwrap"><svg width="240" height="240" viewBox="0 0 240 240" aria-hidden="true"><circle cx="120" cy="120" r="104" fill="none" stroke="rgba(255,255,255,.22)" stroke-width="12"/><circle id="cdRing" cx="120" cy="120" r="104" fill="none" stroke="#fff" stroke-width="12" stroke-linecap="round" stroke-dasharray="653" stroke-dashoffset="0"/></svg><div id="cdNum">3</div></div>
    <div class="cdprio" id="cdPrio" hidden></div>
    <div class="cdinfo"><div><span id="cdPlaceL"></span><b id="cdPlace"></b></div><div><span id="cdDistL"></span><b id="cdDist"></b></div></div>
    <div class="spacer"></div>
    <button id="cdCancel"></button>
    <div class="cdnote" id="cdNote"></div>
  </div>

  <!-- ============ DISPATCHER BROADCAST ============ -->
  <div id="bcOverlay" role="alertdialog" aria-modal="true" aria-labelledby="bcTitle" aria-live="assertive">
    <div class="safesheet">
      <span class="tag" id="bcTag"></span>
      <h3 id="bcTitle"></h3>
      <div class="warnbox" id="bcBody"></div>
      <button class="primary" id="bcRoute" style="flex:none;width:100%" hidden></button>
      <button class="outline" id="bcAck"></button>
    </div>
  </div>

  <!-- ============ PRIORITY PROFILE ============ -->
  <div id="profileOverlay" role="dialog" aria-modal="true" aria-labelledby="profTitle">
    <div class="safesheet">
      <div class="grab"></div>
      <h3 id="profTitle"></h3>
      <div class="warnbox" id="profDesc" style="background:#f3edff;color:#43228a"></div>
      <div id="profNeeds"></div>
      <button class="primary" id="profSave" style="flex:none;width:100%"></button>
      <button class="outline" id="profRemove"></button>
      <button class="linkbtn" id="profClose" style="align-self:center"></button>
    </div>
  </div>

  <!-- ============ SAFE CONFIRM ============ -->
  <div id="safeOverlay" role="dialog" aria-modal="true" aria-labelledby="safeTitle">
    <div class="safesheet">
      <div class="grab"></div>
      <div style="width:56px;height:56px;border-radius:50%;background:#e6f6ec;display:flex;align-items:center;justify-content:center"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#0b7a42" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>
      <h3 id="safeTitle"></h3>
      <div class="warnbox" id="safeWarn"></div>
      <div class="track" id="track" role="slider" data-i18n-aria="m.slide" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" tabindex="0">
        <div class="fill" id="fill"></div>
        <div class="label" id="trackLabel"></div>
        <div class="thumb" id="thumb"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></div>
      </div>
      <div class="hint" id="safeAlt"></div>
      <button class="outline" id="safeCancel"></button>
    </div>
  </div>

  <div id="toast" role="status" aria-live="polite"></div>
</div>

<script type="module">
import { api, citizenId, ensureSession, esc, initMap, loadLang, name, pctColor, state, tr } from './common.js';

const $ = (id) => document.getElementById(id);
const app = $('app');
const buzz = (p) => navigator.vibrate?.(p);
const lsGet = (k, d) => { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch { /* storage blocked */ } };

const IC = {
  FIRE: 'M12 3c1 3 4 5 4 9a4 4 0 0 1-8 0c0-2 1-3 2-4 0 2 1 2 2 2 0-3-1-4 0-7z',
  COLLAPSE: 'M4 20V8l6-3v15M10 20V10l7 3v7M3 20h18',
  FLOOD: 'M3 9c2 0 2-2 4.5-2S10 9 12 9s2.5-2 4.5-2S19 9 21 9M3 15c2 0 2-2 4.5-2S10 15 12 15s2.5-2 4.5-2S19 15 21 15',
  MEDICAL: 'M10 4h4v6h6v4h-6v6h-4v-6H4v-4h6z',
};
const TONE = { FIRE: ['#fdeceb', '#b4231a'], COLLAPSE: ['#fff1de', '#8f4700'], FLOOD: ['#e6f2fd', '#0a5cc2'], MEDICAL: ['#eaf7ee', '#0b7a42'] };
const svg = (d, c, s = 24, w = 1.9) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${d}"/></svg>`;
const NAV = 'M4 11l16-7-7 16-2-7z';

let pos = null; let acc = null; let manual = false; let rec = null; let lastBest = null;
let checkedIn = lsGet('checkedIn', null); // point this device already said it is heading to
const NEEDS = ['wheelchair', 'reduced_mobility', 'medical_transport'];
let profile = lsGet('profile', { role: 'citizen', needs: [] }); // priority-SOS role (kept locally so it works offline)
const isPriority = () => profile.role === 'priority' && profile.needs.length > 0;
let current = lsGet('currentSos', null); // {id|null, type, createdAt, queued?}
let map, layers, roadLayer;

// ------------------------------------------------------------------ i18n
const LANGS = ['az', 'en', 'ru'];
await loadLang(localStorage.getItem('lang') || 'az');
ensureSession().catch(() => {}); // signed device identity; retried below if we start offline
setInterval(() => ensureSession().catch(() => {}), 60_000);
const districts = await api('GET', '/api/districts').then((d) => { lsSet('districts', d); return d; }).catch(() => lsGet('districts', []));

function renderStatic() {
  $('hTitle').textContent = tr('m.whatHappens');
  $('hLead').textContent = tr('m.chooseType');
  $('safeLabel').textContent = tr('ui.imSafe');
  $('safeHint').textContent = tr('m.holdHint');
  $('safeBtn').setAttribute('aria-label', `${tr('ui.imSafe')}. ${tr('m.holdHint')}`);
  $('rowTitle').textContent = tr('m.nearestSafe');
  $('routeTitle').textContent = tr('m.routeTitle');
  $('back').setAttribute('aria-label', tr('m.back'));
  $('safeTitle').textContent = tr('m.safeTitle');
  for (const el of document.querySelectorAll('[data-i18n-aria]')) el.setAttribute('aria-label', tr(el.dataset.i18nAria));
  $('profTitle').textContent = tr('m.profile.title'); $('profDesc').textContent = tr('m.profile.desc');
  $('profSave').textContent = tr('m.profile.save'); $('profRemove').textContent = tr('m.profile.remove'); $('profClose').textContent = tr('m.back');
  renderProfileRow();
  $('safeWarn').textContent = tr('m.safeWarn');
  $('trackLabel').textContent = tr('m.slide');
  $('safeAlt').textContent = tr('m.slideAlt');
  $('safeCancel').textContent = tr('m.stillDanger');
  $('cdCancel').textContent = tr('m.cancel');
  $('cdNote').textContent = tr('m.noNetworkNote');
  $('cdTitle').textContent = tr('m.sending');
  $('cdHelp').textContent = tr('m.cancelIfMistake');
  $('cdPlaceL').textContent = tr('m.place');
  $('cdDistL').textContent = tr('ui.district');
  const sel = $('district'); const cur = sel.value;
  sel.innerHTML = `<option value="">${esc(tr('m.pickDistrict'))}</option>` + districts.map((d) => `<option value="${d.id}">${esc(name(d.name))}</option>`).join('');
  sel.value = cur;
  $('tiles').innerHTML = Object.keys(IC).map((k) => `<button class="tile" data-t="${k}" style="background:${TONE[k][0]};color:${TONE[k][1]}">${svg(IC[k], TONE[k][1], 38, 1.8)}${esc(tr('sos.' + k))}</button>`).join('');
  $('tiles').querySelectorAll('button').forEach((b) => b.addEventListener('click', () => startCountdown(b.dataset.t)));
  $('langs').innerHTML = LANGS.map((l) => `<button data-l="${l}" class="${l === state.lang ? 'on' : ''}">${l.toUpperCase()}</button>`).join('');
  $('langs').querySelectorAll('button').forEach((b) => b.addEventListener('click', async () => { await loadLang(b.dataset.l); renderStatic(); renderAll(); }));
  gpsLabel(); netLabel();
}

// ------------------------------------------------------------------ toast / screens
function toast(msg, err = false, ms = 3200) {
  const el = $('toast'); el.textContent = msg; el.className = `show ${err ? 'err' : ''}`;
  clearTimeout(toast.t); toast.t = setTimeout(() => { el.className = ''; }, ms);
}
function go(screen) {
  app.dataset.screen = screen;
  if (screen === 'route') ensureMap();
  if (screen === 'sent') renderSent();
}

// ------------------------------------------------------------------ network indicator
function netLabel() {
  const on = navigator.onLine;
  $('netDot').className = `dot ${on ? '' : 'off'}`;
  $('netText').textContent = on ? tr('m.online') : tr('m.offline');
  renderSmsHome();
}
addEventListener('online', () => { netLabel(); flush(); refresh(); });
addEventListener('offline', netLabel);

// ------------------------------------------------------------------ location
function gpsLabel() {
  if (!pos) { $('gpsDot').className = 'dot warn'; $('gpsText').textContent = navigator.geolocation ? 'GPS…' : tr('m.noGps'); return; }
  const d = districts.find((x) => x.id === $('district').value);
  $('gpsDot').className = 'dot';
  const where = d ? name(d.name) : '';
  $('gpsText').textContent = manual ? where || tr('ui.district') : `${where ? where + ' · ' : ''}GPS ±${Math.round(acc ?? 0)} ${tr('ui.meters')}`;
  renderSmsHome(); // the SMS template must carry the current location
}
function nearestDistrictId(p) {
  let best = null; let bd = Infinity;
  for (const d of districts) { const dd = (d.lat - p.lat) ** 2 + (d.lng - p.lng) ** 2; if (dd < bd) { bd = dd; best = d.id; } }
  return best;
}
$('district').addEventListener('change', (e) => {
  const d = districts.find((x) => x.id === e.target.value);
  if (d) { manual = true; pos = { lat: d.lat, lng: d.lng }; acc = null; gpsLabel(); refresh(); }
});
if (navigator.geolocation) {
  navigator.geolocation.watchPosition((p) => {
    if (manual) return;
    const first = !pos;
    pos = { lat: p.coords.latitude, lng: p.coords.longitude }; acc = p.coords.accuracy;
    $('district').value = nearestDistrictId(pos) ?? '';
    gpsLabel(); if (first) refresh();
  }, () => { if (!pos) { $('gpsDot').className = 'dot off'; $('gpsText').textContent = tr('m.noGps'); } },
  { enableHighAccuracy: true, maximumAge: 5000, timeout: 15000 });
}

// ------------------------------------------------------------------ evacuation data
// Offline / backup-route mode ----------------------------------------------------------------------------
let clientOfflineSince = null;           // set when the server itself is unreachable and we show saved data
let savedAt = null;                      // timestamp of the saved answer we restored at start-up
const isDegraded = () => !!(rec?.routing?.degraded || clientOfflineSince != null);
function degradedBar() {
  if (!isDegraded()) return '';
  const r = rec?.routing ?? {};
  const lines = [];
  if (clientOfflineSince != null) lines.push(fmtT('m.degraded.clientOffline', { min: Math.max(0, Math.round((Date.now() - clientOfflineSince) / 60000)) }));
  else {
    if (r.sources?.includes('cache')) lines.push(fmtT('m.degraded.cache', { min: Math.max(0, Math.round((r.cacheAgeSec ?? 0) / 60)) }));
    if (r.sources?.includes('matrix')) lines.push(tr('m.degraded.matrix'));
    if (r.sources?.includes('local')) lines.push(tr('m.degraded.local'));
  }
  return `<div class="degbar" role="status" aria-live="polite"><b><span class="dot"></span>${esc(tr('m.degraded.title'))}</b><span>${esc(tr('m.degraded.body'))}</span>${lines.map((l) => `<small>${esc(l)}</small>`).join('')}</div>`;
}
function renderDegraded() { $('degHome').innerHTML = degradedBar(); }

async function refresh() {
  if (!pos) return;
  try {
    const fresh = await api('GET', `/api/evacuation?lat=${pos.lat}&lng=${pos.lng}${isPriority() ? '&accessible=1' : ''}`);
    const wasDegraded = isDegraded();
    rec = fresh; clientOfflineSince = null;
    lsSet('lastRec', { rec, at: Date.now() }); // our own "last cached route" for when the network or server is gone
    const roads = await api('GET', '/api/roads').catch(() => null);
    if (roads) window.__roads = roads;
    if (wasDegraded && !isDegraded()) toast(tr('m.degraded.recovered'));
    renderAll();
    pollBroadcasts();
  } catch {
    // keep what we have and say so: the citizen keeps a usable (older) route instead of an empty screen
    if (rec && clientOfflineSince == null) clientOfflineSince = savedAt ?? Date.now();
    renderAll();
  }
}
setInterval(refresh, 5000);
const bestPoint = () => rec?.points.find((p) => p.id === rec.recommendedPointId) ?? null;

function renderAll() { renderHomeRow(); renderRoute(); renderDegraded(); renderBroadcasts(); if (app.dataset.screen === 'sent') renderSent(); }

function renderHomeRow() {
  const b = bestPoint(); const sub = $('rowSub');
  if (!rec) { sub.className = 's'; sub.textContent = '…'; return; }
  if (!b) { sub.className = 's amber'; sub.textContent = rec.noAccessibleRoute ? tr('m.noAccessible') : tr('ui.noSafePoint'); return; }
  const reroute = (rec.rerouted?.reasons ?? []).some((r) => r !== 'SHORTER_ROUTE');
  sub.className = `s ${reroute ? 'amber' : ''}`;
  sub.textContent = `${reroute ? tr('m.newRoute') + ' ' : ''}${name(b.name)} · ${b.route.etaMin} ${tr('ui.eta')} · ${tr('m.spaceLeft')}`;
}
$('toRoute').addEventListener('click', () => { app.dataset.prev = ''; go('route'); });
$('back').addEventListener('click', () => go(current && app.dataset.prev === 'sent' ? 'sent' : 'home'));

// ------------------------------------------------------------------ route screen
function ensureMap() {
  if (!map) {
    map = initMap($('map'), [40.41, 49.87], 13);
    if (map) { layers = L.layerGroup().addTo(map); roadLayer = L.layerGroup().addTo(map); map.zoomControl.remove(); }
  }
  setTimeout(() => { map?.invalidateSize(); drawMap(); }, 60);
}
function renderRoute() {
  const b = bestPoint(); const sheet = $('sheet');
  const ban = $('routeBanner');
  const reasons = (rec?.rerouted?.reasons ?? []).filter((r) => r !== 'SHORTER_ROUTE');
  ban.hidden = !reasons.length;
  ban.innerHTML = reasons.length ? `<span style="flex:none">${svg('M12 3l10 18H2z M12 10v4 M12 17.5h.01', '#9a5b00', 20, 2.1)}</span><span><b>${esc(tr('m.newRoute'))}</b> ${esc(reasons.map((r) => tr('m.reason.' + r)).join(' '))}</span>` : '';
  ban.className = `float ${reasons.length ? 'banner' : ''}`;
  if (!rec) { sheet.innerHTML = '<div class="grab"></div>'; return; }
  $('routeTitle').textContent = rec.accessible ? tr('m.accessibleRoute') : tr('m.routeTitle');
  if (!b) { sheet.innerHTML = `<div class="grab"></div>${degradedBar()}<div class="banner">${esc(rec.noAccessibleRoute ? tr('m.noAccessible') : tr('ui.noSafePoint'))}</div>`; drawMap(); return; }
  const others = rec.points.filter((p) => p.id !== b.id).slice(0, 2);
  sheet.innerHTML = `<div class="grab"></div>${degradedBar()}
    <div style="display:flex;justify-content:space-between;align-items:flex-end;gap:12px">
      <div style="min-width:0"><div class="eyebrow">● ${esc(rec.accessible ? tr('m.nearestAccessible') : tr('m.nearestSafe'))}</div><div class="pname">${esc(name(b.name))}</div><div class="psub">${b.route.distanceM} ${esc(tr('ui.meters'))} · ${b.occupancyPct}% · ${esc(tr('m.spaceLeft'))}</div>
        ${rec.accessible ? `<div class="accrow" style="margin-top:6px"><b>♿ ${esc(tr('m.accessibleRoute'))}</b>${(b.access ?? []).map((a) => `<span>${esc(tr('acc.' + a))}</span>`).join('')}</div><div class="psub">${esc(tr('m.accessibleOnly'))}</div>` : ''}</div>
      <div class="eta"><b>${isDegraded() ? '≈ ' : ''}${b.route.etaMin}</b><span>${esc(rec.accessible ? tr('ui.eta') : tr('m.walkMin'))}</span></div></div>
    <div class="bar"><i style="width:${Math.min(100, b.occupancyPct)}%;background:${pctColor(b.occupancyPct)}"></i></div>
    <div class="btnrow"><a class="primary" target="_blank" rel="noopener" href="https://www.google.com/maps/dir/?api=1&destination=${b.lat},${b.lng}&travelmode=walking">${svg(NAV, '#fff', 20, 2.2)}${esc(tr('m.navigate'))}</a>
      <button class="secondary" id="heading" ${checkedIn === b.id ? 'disabled' : ''}>${esc(checkedIn === b.id ? '✓ ' + tr('m.headingDone') : tr('ui.checkin'))}</button></div>
    ${others.map((o) => `<div class="alt"><span>${esc(name(o.name))} <small>· ${o.route ? o.route.distanceM + ' ' + esc(tr('ui.meters')) : esc(tr('ui.status.unreachable'))}</small></span><b style="color:${pctColor(o.occupancyPct)}">${o.occupancyPct}%</b></div>`).join('')}`;
  $('heading').addEventListener('click', async () => {
    if (checkedIn === b.id) return;
    $('heading').disabled = true; // one tap only, even before the server answers
    try { await api('POST', `/api/points/${b.id}/checkin`, { body: { citizenId: citizenId() } }); checkedIn = b.id; lsSet('checkedIn', checkedIn); buzz(100); toast(tr('ui.checkedIn')); refresh(); }
    catch (e) { toast(e.message, true); refresh(); }
  });
  if (lastBest && lastBest !== b.id) { buzz([300, 100, 300]); toast(`${tr('m.newRoute')} ${name(b.name)}`); }
  lastBest = b.id;
  drawMap();
}
function drawMap() {
  if (!map || !rec) return;
  layers.clearLayers(); roadLayer.clearLayers();
  for (const r of window.__roads ?? []) if (r.closed) L.polyline([[r.from.lat, r.from.lng], [r.to.lat, r.to.lng]], { color: '#e5352b', weight: 5, dashArray: '9 8' }).addTo(roadLayer);
  for (const p of rec.points) L.circleMarker([p.lat, p.lng], { radius: p.id === rec.recommendedPointId ? 12 : 8, color: '#fff', weight: 3, fillColor: pctColor(p.occupancyPct), fillOpacity: 1 }).bindTooltip(`${name(p.name)} ${p.occupancyPct}%`).addTo(layers);
  const b = bestPoint();
  if (b?.route) {
    const g = b.route.geometry.map((x) => [x.lat, x.lng]);
    L.polyline(g, { color: '#fff', weight: 11, lineCap: 'round' }).addTo(layers);
    L.polyline(g, { color: '#0071e3', weight: 7, lineCap: 'round' }).addTo(layers);
    if (app.dataset.screen === 'route') map.fitBounds(L.latLngBounds(g).pad(0.35), { paddingBottomRight: [0, 220] });
  }
  L.circleMarker([rec.origin.lat, rec.origin.lng], { radius: 9, color: '#fff', weight: 4, fillColor: '#0071e3', fillOpacity: 1 }).addTo(layers);
}

// ------------------------------------------------------------------ SOS: countdown -> send
let cdTimer = null; let cdType = null;
function startCountdown(type) {
  if (!pos) { toast(tr('m.noGps'), true); $('district').focus?.(); return; }
  cdType = type;
  $('cdType').innerHTML = `${svg(IC[type], '#fff', 22)}${esc(tr('sos.' + type))}`;
  $('cdPrio').hidden = !isPriority(); $('cdPrio').textContent = `♿ ${tr('m.priority')}`;
  const d = districts.find((x) => x.id === $('district').value);
  $('cdPlace').textContent = `${pos.lat.toFixed(4)}, ${pos.lng.toFixed(4)}${acc ? ` · ±${Math.round(acc)} m` : ''}`;
  $('cdDist').textContent = d ? name(d.name) : '—';
  let n = 3; $('cdNum').textContent = n;
  const ring = $('cdRing'); ring.classList.remove('run'); ring.style.strokeDashoffset = '0';
  $('countdown').classList.add('on'); buzz(60);
  requestAnimationFrame(() => requestAnimationFrame(() => { ring.classList.add('run'); ring.style.strokeDashoffset = '653'; }));
  clearInterval(cdTimer);
  cdTimer = setInterval(() => {
    n -= 1; buzz(40);
    if (n > 0) { $('cdNum').textContent = n; return; }
    clearInterval(cdTimer); $('countdown').classList.remove('on'); sendSos(cdType);
  }, 1000);
}
$('cdCancel').addEventListener('click', () => { clearInterval(cdTimer); $('countdown').classList.remove('on'); });

async function sendSos(type) {
  const payload = { citizenId: citizenId(), type, lat: pos.lat, lng: pos.lng, ...(isPriority() ? { needs: profile.needs } : {}) };
  try {
    const r = await api('POST', '/api/sos', { body: { ...payload, accuracy: acc ?? undefined } });
    current = { id: r.id, type, createdAt: r.createdAt ?? Date.now(), priority: r.priority ?? (isPriority() ? 1 : 2) };
    sosInfo = { stage: 2, etaSec: null, etaMin: null, brigade: null, priority: current.priority, cancelMsLeft: 60000, _at: Date.now() }; // baseline, so a very fast dispatch is still announced
    buzz([200, 80, 200]);
    if (!r.verified) ensureSession(true).catch(() => {}); // token missing/expired (e.g. server restarted): refresh for next time
  } catch (e) {
    if (e.status && e.status < 500 && e.status !== 429) { toast(e.message, true); return; }
    queue(payload); current = { id: null, type, createdAt: Date.now(), queued: true, priority: isPriority() ? 1 : 2 };
  }
  lsSet('currentSos', current);
  app.dataset.prev = 'sent';
  go('sent');
}
const queue = (p) => lsSet('sosQueue', [...lsGet('sosQueue', []), { ...p, queuedAt: Date.now() }].slice(-20));
async function flush() {
  const q = lsGet('sosQueue', []); if (!q.length) return;
  const rest = [];
  for (const p of q) {
    try {
      const r = await api('POST', '/api/sos', { body: p });
      if (current?.queued && current.type === p.type) { current = { id: r.id, type: p.type, createdAt: r.createdAt ?? Date.now(), priority: r.priority ?? current.priority }; lsSet('currentSos', current); }
    } catch (e) { if (!e.status || e.status >= 500 || e.status === 429) rest.push(p); }
  }
  lsSet('sosQueue', rest);
  if (rest.length < q.length) { toast(tr('m.sentTitle')); if (app.dataset.screen === 'sent') renderSent(); }
}
setInterval(flush, 15000); flush();

// ------------------------------------------------------------------ sent screen
let sentTimer = null; let sosInfo = null;
async function pollSos() {
  if (!current?.id) return;
  const prevStage = sosInfo?.stage ?? null;
  try {
    sosInfo = await api('GET', `/api/sos/${current.id}`); sosInfo._at = Date.now();
    if (prevStage != null && sosInfo.stage !== prevStage) {
      if (sosInfo.stage === 3) { buzz([200, 80, 200]); toast(fmtT('m.toast.dispatched', { name: sosInfo.brigade?.name ?? '', min: sosInfo.etaMin ?? '?' }), false, 5000); }
      else if (sosInfo.stage === 4) { buzz([300, 100, 300]); toast(tr('m.toast.arrived'), false, 5000); }
    }
  } catch (e) { if (e.status === 404) { current = null; lsSet('currentSos', null); go('home'); } }
  if (app.dataset.screen === 'sent') renderSent();
}
function renderSent() {
  clearTimeout(sentTimer);
  const el = $('sent');
  if (!current) { go('home'); return; }
  const queued = current.queued;
  const type = current.type;
  const time = new Date(current.createdAt).toLocaleTimeString(state.lang, { hour: '2-digit', minute: '2-digit', second: '2-digit' });
  const stage = queued ? 0 : sosInfo?.stage ?? 2;
  const left = queued ? 0 : sosInfo ? Math.max(0, sosInfo.cancelMsLeft - (Date.now() - sosInfo._at)) : Math.max(0, 60000 - (Date.now() - current.createdAt));
  const mm = (ms) => `${Math.floor(ms / 60000)}:${String(Math.floor((ms % 60000) / 1000)).padStart(2, '0')}`;
  const b = bestPoint();
  const step = (n, text, extra) => {
    const idx = stage - 1; // stage 2 = "assigning" = step index 1, stage 3 = on the way, stage 4 = arrived
    const cls = n < idx ? 'done' : n === idx ? 'now' : 'todo'; const mark = n < idx ? '✓' : n === idx ? '●' : '';
    return `<div class="step ${cls}"><div class="m">${mark}</div><div class="w">${esc(text)}</div><small>${esc(extra)}</small></div>`;
  };
  const etaLeft = sosInfo?.etaSec != null ? Math.max(0, sosInfo.etaSec - Math.floor((Date.now() - sosInfo._at) / 1000)) : null;
  const eta = etaLeft != null ? ` · ${Math.floor(etaLeft / 60)}:${String(etaLeft % 60).padStart(2, '0')}` : sosInfo?.etaMin ? ` · ~${sosInfo.etaMin} ${tr('ui.eta')}` : '';
  const prio = (sosInfo?.priority ?? current.priority) === 1;
  el.innerHTML = `
    <div class="miniTop"><div class="chip" style="pointer-events:none"><span class="dot ${navigator.onLine ? '' : 'off'}"></span>${esc($('gpsText').textContent)}</div></div>
    <div class="hero ${queued ? 'queued' : ''}"><div class="badge">${queued ? svg('M12 8v5l3 2 M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18z', '#9a5b00', 44, 2.2) : svg('M5 12.5l4.5 4.5L19 7.5', '#0b7a42', 44, 2.4)}</div>
      <h2>${esc(queued ? tr('m.queuedTitle') : tr('m.sentTitle'))}</h2>${prio ? `<div class="prio">♿ ${esc(tr('m.priority'))}</div>` : ''}<p>${esc(queued ? tr('m.queuedBody') : tr('m.sentBody'))}${prio && !queued ? ' ' + esc(tr('m.priorityNote')) : ''}</p></div>
    ${queued ? smsCard(type) : ''}
    <div class="box"><div class="hd"><span style="display:flex;align-items:center;gap:10px">${svg(IC[type], TONE[type][1], 24)}${esc(tr('sos.' + type))}</span><small>${esc(time)}</small></div>
      ${queued ? '' : `<div class="sep"></div>${step(0, tr('m.step1'), stage >= 1 ? time.slice(0, 5) : '')}${step(1, prio ? tr('m.transportAssign') : tr('m.step2'), stage === 2 ? tr('m.now') : '')}${step(2, (prio ? tr('m.transportOnWay') : tr('m.step3')) + (stage >= 3 && sosInfo?.brigade ? ` · ${sosInfo.brigade.name} (${tr('brigade.kind.' + sosInfo.brigade.kind)})` : '') + (stage === 3 ? eta : ''), '')}${step(3, prio ? tr('m.transportArrived') : tr('m.step4'), '')}`}</div>
    ${b ? `<div class="card"><div class="eyebrow" style="color:#0066cc">${esc(tr('m.safeExit'))}</div><div style="font:800 18px var(--head);letter-spacing:-0.03em">${esc(name(b.name))} · ${b.route.distanceM} ${esc(tr('ui.meters'))}</div>
      <button class="primary" id="sentRoute" style="flex:none;width:100%">${svg(NAV, '#fff', 18, 2.2)}${esc(tr('m.showRoute'))}</button></div>` : ''}
    <div class="spacer"></div>
    <div style="display:flex;justify-content:space-between;align-items:center">
      <button class="linkbtn" id="mistake">${esc(tr('m.mistake'))}</button>
      ${left > 0 ? `<span class="muted" style="color:var(--muted);font-size:13px">${esc(tr('m.cancelWindow'))}: ${mm(left)}</span>` : '<span></span>'}
    </div>
    <button class="linkbtn" id="dismiss" style="align-self:center">${esc(tr('m.back'))}</button>`;
  $('sentRoute')?.addEventListener('click', () => { app.dataset.prev = 'sent'; go('route'); });
  $('dismiss').addEventListener('click', () => { app.dataset.prev = ''; go('home'); });
  $('mistake').addEventListener('click', async () => {
    if (queued) { lsSet('sosQueue', []); current = null; lsSet('currentSos', null); toast(tr('m.cancelled')); go('home'); return; }
    try { await api('POST', `/api/sos/${current.id}/cancel`, { body: { citizenId: citizenId() } }); current = null; lsSet('currentSos', null); toast(tr('m.cancelled')); go('home'); }
    catch (e) { toast(e.message, true); }
  });
  if (left > 0 || (stage === 3 && etaLeft != null)) sentTimer = setTimeout(renderSent, 1000);
}
setInterval(() => { if (current?.id) pollSos(); }, 2000); // also while on other screens, so the toast still arrives

// ------------------------------------------------------------------ SMS fallback (no internet)
let smsNumber = lsGet('smsNumber', '1234');
api('GET', '/api/config').then((c) => { if (c.sms?.number) { smsNumber = c.sms.number; lsSet('smsNumber', smsNumber); } }).catch(() => {});
const SMS_KW = { FIRE: 'YANGIN', COLLAPSE: 'DAGINTI', FLOOD: 'SEL', MEDICAL: 'TIBBI' };
const NEED_KW = { wheelchair: 'ELIL', reduced_mobility: 'YERIMIR', medical_transport: 'NEQLIYYAT' };
const fmtT = (key, vars) => Object.entries(vars).reduce((t, [k, v]) => t.replace(`{${k}}`, v), tr(key));
function smsBody(type) {
  const where = pos ? `${pos.lat.toFixed(5)},${pos.lng.toFixed(5)}` : $('district').value;
  return `SOS ${SMS_KW[type] ?? 'TIBBI'}${isPriority() ? ' ' + profile.needs.map((n) => NEED_KW[n]).join(' ') : ''} ${where}`.trim();
}
const smsHref = (type) => `sms:${smsNumber}?&body=${encodeURIComponent(smsBody(type))}`;
function smsCard(type) {
  return `<div class="smscard"><b>${esc(tr('m.sms.title'))}</b><span>${esc(fmtT('m.sms.hint', { number: smsNumber, sample: smsBody(type) }))}</span><a class="smslink" href="${smsHref(type)}">${esc(tr('m.sms.btn'))}</a></div>`;
}
function renderSmsHome() {
  const el = $('smsHome');
  if (navigator.onLine) { el.innerHTML = ''; return; }
  el.innerHTML = `<div class="smscard"><b>${esc(tr('m.sms.title'))}</b><span>${esc(fmtT('m.sms.hint', { number: smsNumber, sample: smsBody('MEDICAL') }))}</span>
    <div style="display:grid;grid-template-columns:repeat(2,1fr);gap:8px">${Object.keys(SMS_KW).map((k) => `<a class="smslink" href="${smsHref(k)}">${esc(tr('sos.' + k))}</a>`).join('')}</div></div>`;
}

// ------------------------------------------------------------------ dispatcher broadcasts (pull: we send our position, the server never stores it)
const bcKey = (b) => `${b.id}@${b.createdAt}`; // ids restart with the server: the timestamp keeps a new notice from looking "already read"
const bcAcked = new Set(lsGet('bcAcked', []));
const bcAnnounced = new Set();
let bcList = [];
const bcHead = (b) => (b.type === 'custom' ? tr('bc.custom.title') : tr('bc.' + b.type + '.title').replace('{point}', b.point ? name(b.point.name) : ''));
const bcText = (b) => (b.type === 'custom'
  ? b.text[state.lang] ?? b.text.en ?? b.text.az ?? b.text.ru ?? ''
  : tr('bc.' + b.type + '.body') + (b.substituted ? ' ' + tr('bc.evacuate.substituted') : ''));
async function pollBroadcasts() {
  try {
    const q = [pos && `lat=${pos.lat}&lng=${pos.lng}`, isPriority() && 'accessible=1'].filter(Boolean).join('&');
    bcList = (await api('GET', `/api/broadcasts${q ? '?' + q : ''}`)).broadcasts;
    renderBroadcasts();
  } catch { /* offline: keep what we have */ }
}
setInterval(pollBroadcasts, 5000);
function ackBc(b, thenRoute = false) {
  bcAcked.add(bcKey(b)); lsSet('bcAcked', [...bcAcked].slice(-100));
  api('POST', `/api/broadcasts/${b.id}/ack`).catch(() => {});
  renderBroadcasts();
  if (thenRoute && b.point) { app.dataset.prev = ''; go('route'); }
}
function renderBroadcasts() {
  const pending = bcList.filter((b) => !bcAcked.has(bcKey(b)));
  const crit = pending.find((b) => b.severity === 'critical');
  const counting = $('countdown').classList.contains('on'); // never cover the 3-second SOS cancel button
  if (crit && !counting) {
    $('bcTag').textContent = tr('bc.severity.critical');
    $('bcTitle').textContent = bcHead(crit); $('bcBody').textContent = bcText(crit);
    $('bcAck').textContent = tr('bc.ack');
    const showRoute = crit.type === 'evacuate' && crit.point;
    $('bcRoute').hidden = !showRoute; $('bcRoute').textContent = tr('m.showRoute');
    $('bcAck').onclick = () => ackBc(crit); $('bcRoute').onclick = () => ackBc(crit, true);
    $('bcOverlay').classList.add('on');
    if (!bcAnnounced.has(bcKey(crit))) { bcAnnounced.add(bcKey(crit)); buzz([250, 120, 250, 120, 500]); }
  } else $('bcOverlay').classList.remove('on');
  const rest = pending.filter((b) => b !== crit);
  $('bcBanners').innerHTML = rest.map((b, i) => `<div class="bcbanner ${b.severity === 'info' ? 'info' : ''}" role="status"><b>${esc(bcHead(b))}</b><span>${esc(bcText(b))}</span><button data-bc="${i}">${esc(tr('bc.ack'))}</button></div>`).join('');
  $('bcBanners').querySelectorAll('[data-bc]').forEach((el) => el.addEventListener('click', () => ackBc(rest[Number(el.dataset.bc)])));
  for (const b of rest) if (!bcAnnounced.has(bcKey(b))) { bcAnnounced.add(bcKey(b)); buzz([120, 80, 120]); }
}

// ------------------------------------------------------------------ priority-SOS profile (reduced mobility / special care)
function renderProfileRow() {
  $('profileLabel').textContent = isPriority() ? tr('m.profile.rowOn') : tr('m.profile.row');
  $('profileBtn').classList.toggle('on', isPriority());
}
async function syncProfile() {
  try { await ensureSession(); await api('POST', '/api/profile', { body: profile }); return true; }
  catch { return false; } // offline: needs still travel with every SOS and with ?accessible=1
}
function openProfile() {
  $('profNeeds').innerHTML = NEEDS.map((n) => `<label class="opt"><input type="checkbox" value="${n}" ${profile.needs.includes(n) ? 'checked' : ''}><span>${esc(tr('m.need.' + n))}</span></label>`).join('');
  $('profRemove').hidden = !isPriority();
  $('profileOverlay').classList.add('on');
}
const closeProfile = () => $('profileOverlay').classList.remove('on');
$('profileBtn').addEventListener('click', openProfile);
$('profClose').addEventListener('click', closeProfile);
$('profileOverlay').addEventListener('click', (e) => { if (e.target === $('profileOverlay')) closeProfile(); });
$('profSave').addEventListener('click', async () => {
  const needs = [...$('profNeeds').querySelectorAll('input:checked')].map((i) => i.value);
  if (!needs.length) { toast(tr('m.profile.pickOne'), true); return; }
  profile = { role: 'priority', needs }; lsSet('profile', profile);
  closeProfile(); renderProfileRow(); toast(tr('m.profile.saved')); buzz(80);
  await syncProfile(); refresh();
});
$('profRemove').addEventListener('click', async () => {
  profile = { role: 'citizen', needs: [] }; lsSet('profile', profile);
  closeProfile(); renderProfileRow(); toast(tr('m.profile.removed'));
  await syncProfile(); refresh();
});
if (isPriority()) syncProfile(); // re-bind the role to this device after a server restart

// ------------------------------------------------------------------ "I'm safe": hold 1.5s -> sheet -> slide (or hold 2s) -> confirm
const safeBtn = $('safeBtn'); let holdT = null;
const stopHold = () => { clearTimeout(holdT); safeBtn.classList.remove('holding'); };
safeBtn.addEventListener('pointerdown', (e) => {
  e.preventDefault(); safeBtn.classList.add('holding'); buzz(30);
  holdT = setTimeout(() => { safeBtn.classList.remove('holding'); buzz([60, 40, 60]); openSafe(); }, 1500);
});
for (const ev of ['pointerup', 'pointerleave', 'pointercancel']) safeBtn.addEventListener(ev, stopHold);
safeBtn.addEventListener('click', (e) => { if (e.detail === 0) openSafe(); else toast(`${tr('ui.imSafe')}: ${tr('m.holdHint')}`); }); // keyboard activation opens directly

const track = $('track'); const thumb = $('thumb'); const fill = $('fill');
function openSafe() { $('safeOverlay').classList.add('on'); setThumb(0); $('safeCancel').focus(); }
function closeSafe() { $('safeOverlay').classList.remove('on'); setThumb(0); }
$('safeCancel').addEventListener('click', closeSafe);
$('safeOverlay').addEventListener('click', (e) => { if (e.target === $('safeOverlay')) closeSafe(); });
const maxX = () => track.clientWidth - 56 - 12;
function setThumb(x, animate = false) {
  thumb.style.transition = fill.style.transition = animate ? 'all .2s' : 'none';
  thumb.style.transform = `translateX(${x}px)`; fill.style.width = `${x + 68}px`;
  track.setAttribute('aria-valuenow', String(Math.round((x / Math.max(1, maxX())) * 100)));
}
let dragging = false; let startX = 0; let holdSafe = null; let moved = false;
thumb.addEventListener('pointerdown', (e) => {
  dragging = true; moved = false; startX = e.clientX; thumb.setPointerCapture(e.pointerId);
  holdSafe = setTimeout(() => { if (dragging && !moved) { dragging = false; confirmSafe(); } }, 2000); // accessible alternative to sliding
});
thumb.addEventListener('pointermove', (e) => {
  if (!dragging) return;
  const x = Math.min(maxX(), Math.max(0, e.clientX - startX));
  if (x > 8) { moved = true; clearTimeout(holdSafe); }
  setThumb(x);
});
const endDrag = () => {
  clearTimeout(holdSafe); if (!dragging) return; dragging = false;
  const x = parseFloat(thumb.style.transform.replace(/[^\d.-]/g, '')) || 0;
  if (x >= maxX() * 0.85) confirmSafe(); else setThumb(0, true);
};
thumb.addEventListener('pointerup', endDrag); thumb.addEventListener('pointercancel', endDrag);
track.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ' || e.key === 'ArrowRight') { e.preventDefault(); confirmSafe(); } });
async function confirmSafe() {
  setThumb(maxX(), true); buzz(100);
  try {
    await api('POST', '/api/safe', { body: { citizenId: citizenId(), ...(pos ?? {}) } });
    current = null; lsSet('currentSos', null); sosInfo = null;
    toast(tr('m.safeDone')); closeSafe(); go('home');
  } catch (e) { toast(e.message, true); setThumb(0, true); }
}

{ // cold start with no network/server: show the last saved answer, clearly flagged
  const saved = lsGet('lastRec', null);
  if (saved?.rec && Date.now() - saved.at < 6 * 3600_000) { rec = saved.rec; savedAt = saved.at; if (!navigator.onLine) clientOfflineSince = saved.at; }
}
renderStatic();
if (rec) renderAll();
if (current) { app.dataset.prev = 'sent'; go('sent'); pollSos(); }
if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(() => {});
</script>
</body>
</html>
