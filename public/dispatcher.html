<!doctype html>
<html lang="az">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dispetçer</title>
<link rel="stylesheet" href="/vendor/leaflet.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Plus+Jakarta+Sans:wght@700;800&amp;display=swap">
<script src="/vendor/leaflet.js"></script>
<style>
  :root { --ink:#0b0b0f; --muted:#5f6470; --soft:#f4f5f7; --line:#e4e5ea; --blue:#0071e3; --green:#1a9e55; --green-ink:#0b7a42; --red:#ff3b30; --red-ink:#b4231a;
          --head:'Plus Jakarta Sans','Inter',system-ui,-apple-system,Segoe UI,Roboto,sans-serif; --body:'Inter',system-ui,-apple-system,Segoe UI,Roboto,sans-serif; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--soft); color:var(--ink); font:14px/1.4 var(--body); }
  button { font:inherit; color:inherit; cursor:pointer; } button:disabled { opacity:.5; cursor:not-allowed; }
  header { background:#fff; border-bottom:1px solid var(--line); padding:12px 24px; display:flex; align-items:center; gap:14px; flex-wrap:wrap; }
  .logo { font:800 18px var(--head); letter-spacing:-0.04em; } .logo span { color:var(--blue); }
  .pill { font-size:13px; border-radius:999px; padding:6px 12px; background:var(--soft); color:var(--muted); display:flex; align-items:center; gap:8px; }
  .pill.ok { background:#e6f6ec; color:var(--green-ink); font-weight:600; } .pill.bad { background:#fdeceb; color:var(--red-ink); font-weight:600; }
  .live { width:8px; height:8px; border-radius:50%; background:var(--green); }
  select, input { font:inherit; padding:7px 10px; border:1px solid var(--line); border-radius:10px; background:#fff; color:var(--ink); }
  .grow { flex-grow:1; }

  .col { min-width:0; display:flex; flex-direction:column; gap:12px; }
  .left { flex:1 1 340px; max-width:400px; } .mid { flex:999 1 520px; } .right { flex:1 1 280px; max-width:330px; }
  .h { display:flex; align-items:center; justify-content:space-between; font:800 16px var(--head); letter-spacing:-0.02em; }
  .count { background:var(--red); color:#fff; border-radius:999px; padding:1px 9px; font-size:12px; margin-left:6px; }
  .card { background:#fff; border:1px solid var(--line); border-radius:16px; padding:14px; }
  .lbl { font-size:12px; font-weight:600; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); margin-bottom:8px; }
  .alert { background:#fff; border:2px solid var(--red); border-radius:18px; padding:16px; display:flex; flex-direction:column; gap:10px; cursor:pointer; }
  .alert.done { border-color:var(--green); }
  .alert.amber { border-color:#e8a100; } .alert.amber .eyebrow { color:#8a5a00; } .alert.amber .eyebrow .d { background:#e8a100; } .alert.amber .approve { background:#d68500; }
  .eyebrow { display:flex; align-items:center; gap:8px; font-size:12px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--red-ink); } .eyebrow .d { width:10px; height:10px; border-radius:50%; background:var(--red); } .eyebrow time { margin-left:auto; font-weight:400; text-transform:none; letter-spacing:0; color:var(--muted); }
  .alert.done .eyebrow { color:var(--green-ink); } .alert.done .eyebrow .d { background:var(--green); }
  .atitle { font:800 18px/1.2 var(--head); letter-spacing:-0.03em; }
  .chips { display:flex; gap:6px; flex-wrap:wrap; } .chip { border-radius:999px; padding:3px 10px; font-size:12px; font-weight:600; }
  .plan { background:var(--soft); border-radius:14px; padding:12px 14px; display:flex; flex-direction:column; gap:8px; } .plan div { display:flex; gap:10px; align-items:center; font-size:14px; }
  .approve { height:52px; border:0; border-radius:14px; background:var(--red); color:#fff; font:700 16px var(--head); }
  .undo { height:46px; border:1.5px solid var(--line); border-radius:14px; background:#fff; font:700 15px var(--head); }
  .small { font-size:12px; color:var(--muted); text-align:center; }
  .feed div { display:flex; gap:10px; align-items:center; padding:6px 0; border-top:1px solid #f0f1f4; font-size:13.5px; } .feed div:first-of-type { border-top:0; } .feed i { width:8px; height:8px; border-radius:50%; flex:none; } .feed span { flex-grow:1; } .feed small { color:var(--muted); }
  .flagtag { font-size:11px; font-weight:600; border-radius:999px; padding:1px 8px; background:#fff1de; color:#8f4700; }
  .abuse { border-radius:16px; padding:12px 14px; font-size:13.5px; line-height:1.4; } .abuse.attack { background:#fdeceb; color:#8f1d15; border:1.5px solid #f0b4af; } .abuse.surge { background:#fff4de; color:#6b3f00; border:1.5px solid #f2d596; }
  .sc { border:1px solid var(--line); border-radius:12px; padding:10px 12px; margin-bottom:8px; } .sc b { display:block; font-size:13.5px; } .sc span { display:block; font-size:12px; color:var(--muted); margin:2px 0 8px; }
  .sc button { border:0; background:var(--blue); color:#fff; border-radius:8px; padding:5px 12px; font-size:12.5px; font-weight:600; }
  .tm { display:flex; align-items:center; gap:12px; padding:10px 14px; } .tm input { flex-grow:1; accent-color:var(--blue); } .tmlabel { font-size:13px; color:var(--muted); min-width:190px; text-align:right; }
  .tmbtn { border:1px solid var(--line); background:#fff; border-radius:10px; padding:6px 12px; font-size:13px; font-weight:600; white-space:nowrap; } .tmbtn.live { background:var(--blue); color:#fff; border-color:var(--blue); }
  .replaybanner { position:absolute; left:50%; transform:translateX(-50%); top:12px; max-width:86%; text-align:center; z-index:1000; background:#fff4de; color:#6b3f00; border:1.5px solid #f2d596; border-radius:999px; padding:6px 14px; font-size:12.5px; font-weight:600; box-shadow:0 1px 3px rgba(0,0,0,.12); }
  .alert.priority { border-color:#7c3aed; background:#fbf9ff; box-shadow:0 0 0 3px rgba(124,58,237,.12); } .alert.priority .eyebrow { color:#43228a; } .alert.priority .eyebrow .d { background:#7c3aed; } .alert.priority .approve { background:#6d3fd8; }
  .need { background:#ede4ff; color:#43228a; border-radius:999px; padding:3px 10px; font-size:12px; font-weight:600; } .accfeat { background:#f3edff; color:#43228a; border-radius:999px; padding:1px 8px; font-size:11.5px; font-weight:600; margin-left:4px; }
  .bcform { display:flex; flex-direction:column; gap:8px; margin-top:10px; } .bcform label { font-size:12px; font-weight:600; color:var(--muted); } .bcform select, .bcform textarea { width:100%; font:inherit; padding:7px 10px; border:1px solid var(--line); border-radius:10px; }
  .bcprev { background:#f6f1ff; color:#43228a; border-radius:12px; padding:10px 12px; font-size:13.5px; line-height:1.4; min-height:20px; }
  .bch { border:1px solid var(--line); border-radius:12px; padding:8px 10px; margin-bottom:8px; font-size:13px; } .bch b { display:block; } .bch .meta { color:var(--muted); font-size:12px; display:flex; justify-content:space-between; gap:8px; align-items:center; margin-top:3px; }
  .mv { height:4px; background:var(--soft); border-radius:2px; margin-top:4px; overflow:hidden; } .mv i { display:block; height:100%; background:#0071e3; }
  .pick { display:flex; gap:8px; align-items:center; font-size:12.5px; color:var(--muted); } .pick select { flex:1; min-width:0; font:inherit; font-size:13px; padding:7px 8px; border:1px solid var(--line); border-radius:10px; background:#fff; color:var(--ink); }
  .warnrow { background:#fff4de; color:#6b3f00; border-radius:10px; padding:8px 10px; font-size:12.5px; line-height:1.35; } .mtag { font-size:11px; font-weight:700; border-radius:999px; padding:1px 8px; background:#fff4de; color:#8a5a00; margin-left:4px; }
  .pill.warn { background:#fff4de; color:#8a5a00; font-weight:600; } .pill .dotw { width:8px; height:8px; border-radius:50%; background:#e8a100; }
  .rt { font-size:13px; } .rt .row { display:flex; justify-content:space-between; gap:10px; padding:5px 0; border-top:1px solid #f0f1f4; } .rt .row:first-child { border-top:0; } .rt .row span:first-child { color:var(--muted); }
  .rt .srcs { display:flex; gap:6px; flex-wrap:wrap; margin-top:6px; } .rt .srcs span { background:var(--soft); border-radius:999px; padding:2px 10px; font-size:12px; font-weight:600; }
  .pend { border:1px solid var(--line); border-radius:12px; padding:10px 12px; margin-bottom:8px; display:flex; flex-direction:column; gap:8px; cursor:pointer; } .pend .top { display:flex; justify-content:space-between; gap:8px; font-size:13.5px; align-items:center; } .pend .top small { color:var(--muted); }
  .pend button.go { height:40px; border:0; border-radius:10px; background:var(--blue); color:#fff; font:700 14px var(--head); }
  .rel { border:1px solid var(--line); background:#fff; border-radius:8px; padding:3px 10px; font-size:12.5px; font-weight:600; }
  .kpis { display:flex; gap:12px; flex-wrap:wrap; } .kpi { flex:1 1 130px; background:#fff; border:1px solid var(--line); border-radius:16px; padding:12px 16px; } .kpi small { color:var(--muted); font-size:12px; } .kpi div { display:flex; align-items:baseline; gap:8px; } .kpi b { font:800 28px var(--head); letter-spacing:-0.04em; }
  #mapbox { position:relative; flex-grow:1; min-height:440px; border-radius:18px; overflow:hidden; border:1px solid var(--line); }
  #map { position:absolute; inset:0; }
  .legend { position:absolute; left:12px; top:12px; z-index:1000; background:#fff; border-radius:12px; padding:8px 12px; display:flex; gap:14px; font-size:12.5px; box-shadow:0 1px 3px rgba(0,0,0,.12); flex-wrap:wrap; }
  .bar { height:6px; border-radius:3px; background:var(--soft); margin-top:6px; overflow:hidden; } .bar i { display:block; height:100%; }
  .prow { margin-bottom:12px; } .prow > div:first-child { display:flex; justify-content:space-between; font-size:13.5px; font-weight:500; }
  .brow { display:flex; justify-content:space-between; align-items:center; padding:8px 0; border-top:1px solid #f0f1f4; font-size:13.5px; gap:8px; } .brow:first-of-type { border-top:0; }
  .state { border-radius:999px; padding:2px 10px; font-size:12px; font-weight:600; }
  .sim { display:flex; gap:6px; flex-wrap:wrap; align-items:center; } .sim button { border:1px solid var(--line); background:#fff; border-radius:10px; padding:6px 10px; font-size:13px; }
  #login { position:fixed; inset:0; z-index:5000; background:rgba(11,11,15,.55); display:none; align-items:center; justify-content:center; padding:16px; } #login.on { display:flex; }
  #login form { background:#fff; border-radius:20px; padding:22px; width:340px; display:flex; flex-direction:column; gap:12px; } #login h2 { margin:0; font:800 22px var(--head); letter-spacing:-0.04em; }
  #login button { height:48px; border:0; border-radius:14px; background:var(--blue); color:#fff; font:700 16px var(--head); }
  #toast { position:fixed; left:50%; bottom:18px; transform:translate(-50%,120px); background:#0b0b0f; color:#fff; padding:12px 18px; border-radius:12px; transition:.25s; z-index:6000; font-weight:600; } #toast.show { transform:translate(-50%,0); } #toast.err { background:var(--red-ink); }
  .tm { display:grid; grid-template-columns:auto auto minmax(100px,1fr) auto; gap:10px; }
  .tm .tmlabel { grid-column:1 / -1; grid-row:2; min-width:0; text-align:left; font-variant-numeric:tabular-nums; height:19px; }
  .tm .tmbtn { min-width:90px; min-height:36px; }
  .tm .tmbtn.live { width:auto; height:auto; border-radius:10px; }
  .tmtrack { position:relative; min-width:0; }
  #tmRange { width:100%; margin:0; padding:0; height:6px; display:block; appearance:none; border:0; border-radius:8px; background:linear-gradient(to right,var(--blue) var(--progress,100%),var(--line) var(--progress,100%)); cursor:pointer; }
  #tmRange::-webkit-slider-thumb { appearance:none; width:15px; height:15px; border-radius:50%; background:var(--blue); border:3px solid #fff; box-shadow:0 0 0 1px var(--blue); }
  #tmTicks { position:absolute; inset:10px 7px auto; height:5px; pointer-events:none; }
  #tmTicks i { position:absolute; height:5px; width:2px; background:#a4b5c8; }
  #scPanel { overflow:hidden; }
  #scList { display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr)); gap:8px; max-height:285px; overflow:auto; overscroll-behavior:contain; scrollbar-gutter:stable; }
  .sc { margin:0; display:grid; grid-template-columns:1fr auto; gap:4px 8px; align-items:start; }
  .sc span { grid-column:1 / -1; grid-row:2; margin:0; }
  .sc button { grid-column:2; grid-row:1; }
  #scPanel .sim { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); }
  #scPanel .sim:has(#simPoint) { grid-template-columns:minmax(0,1fr) 90px; }
  #scPanel .sim:has(#simPoint) button { grid-column:1 / -1; }
  .percentage { display:flex; align-items:center; gap:4px; }
  main { align-items:flex-start; }
  #mapbox { flex:none; height:clamp(440px,60vh,720px); }
  .replaybanner { top:auto; bottom:28px; max-width:86%; text-align:center; }
  #scPanel select { min-width:0; width:100%; text-overflow:ellipsis; }
  #scPanel .sim button { white-space:normal; overflow-wrap:anywhere; }
  #scPanel[open] > :not(summary) { animation:panel-in .2s ease-out; }
  @keyframes panel-in { from { opacity:0; transform:translateY(-6px); } to { opacity:1; transform:translateY(0); } }
  @media (max-width:600px) { main { padding:12px; } .left,.right { max-width:none; } .tm { grid-template-columns:auto auto 1fr; } .tmtrack { grid-column:1 / -1; grid-row:2; } .tm .tmlabel { grid-row:3; } .tm #tmLive { justify-self:end; } }
  @media (prefers-reduced-motion:reduce) { #scPanel[open] > :not(summary) { animation:none; } }
  ::view-transition-old(root), ::view-transition-new(root) { animation-duration:160ms; }
  @supports (interpolate-size:allow-keywords) {
    #scPanel { interpolate-size:allow-keywords; }
    #scPanel::details-content { height:0; overflow:clip; transition:height .22s ease,content-visibility .22s allow-discrete; }
    #scPanel[open]::details-content { height:auto; }
  }
</style>
</head>
<body>
<header>
  <div class="logo">Urban Crisis <span>Engine</span></div>
  <div class="grow"></div>
  <div class="pill"><span class="live"></span><span id="clock"></span></div>
  <div class="pill ok" id="apiPill"></div>
  <div class="pill" id="who" style="display:none"></div><button id="logout" class="pill" style="display:none;cursor:pointer;border:0"></button>
  <select id="lang"><option value="az">AZ</option><option value="en">EN</option><option value="ru">RU</option></select>
</header>

<div id="protect" style="display:none;background:#b4231a;color:#fff;padding:10px 18px;font:600 14px var(--head)"></div>
<main>
  <section class="col left">
    <div class="h"><span><span id="tAlerts"></span><span class="count" id="alertCount">0</span></span><span class="small" id="tCritical"></span></div>
    <div id="abuse"></div>
    <div id="alerts" style="display:flex;flex-direction:column;gap:12px"></div>
    <div class="card" id="pendCard" hidden><div class="lbl" id="tPend"></div><div class="small" id="pendHint" style="text-align:left;margin-bottom:8px"></div><div id="pending"></div></div>
    <div class="card" id="quarCard" hidden><div class="lbl" id="tSusp"></div><div class="small" id="suspNote" style="text-align:left;margin-bottom:8px"></div><div class="feed" id="quar"></div></div>
    <details class="card" id="bcCard"><summary class="lbl" id="bcSummary" style="cursor:pointer;margin:0"></summary>
      <div class="bcform">
        <label for="bcType" id="bcLType"></label><select id="bcType"></select>
        <label for="bcTarget" id="bcLTarget"></label><select id="bcTarget"></select>
        <select id="bcDistrict" hidden></select>
        <div id="bcPointRow" hidden><label for="bcPoint" id="bcLPoint"></label><select id="bcPoint"></select></div>
        <div id="bcTextRow" hidden><textarea id="bcTextAz" maxlength="280" rows="2"></textarea><textarea id="bcTextEn" maxlength="280" rows="2"></textarea></div>
        <div class="bcprev" id="bcPreview"></div>
        <button id="bcSend" class="approve" style="height:44px;font-size:15px"></button>
      </div>
      <div class="lbl" id="bcHistTitle" style="margin-top:14px"></div><div id="bcHistory"></div>
    </details>
    <div class="card"><div class="lbl" id="tFeed"></div><div class="feed" id="feed"></div></div>
  </section>

  <section class="col mid">
    <div class="kpis" id="kpis"></div>
    <div id="mapbox"><div id="map"></div><div class="legend" id="legend"></div><div class="replaybanner" id="replayBanner" hidden></div></div>
    <div class="card tm" id="tm">
      <button id="tmPlay" class="tmbtn"></button>
      <select id="tmSpeed" aria-label="Playback speed"><option value="0.5">0.5x</option><option value="1" selected>1x</option><option value="2">2x</option><option value="4">4x</option></select>
      <div class="tmtrack"><div id="tmTicks" aria-hidden="true"></div><input id="tmRange" type="range" min="0" max="100" step="any" value="100" data-i18n-aria="d.history"></div>
      <span id="tmLabel" class="tmlabel"></span>
      <button id="tmLive" class="tmbtn"></button>
    </div>
  </section>

  <section class="col right">
    <div class="card"><div class="lbl" id="tPoints"></div><div id="points"></div></div>
    <div class="card rt"><div class="lbl" id="tRouting"></div><div id="routing"></div></div>
    <div class="card"><div class="lbl" id="tBrigades"></div><div id="brigades"></div></div>
    <div class="card"><div class="lbl" id="tJournal"></div><div class="feed" id="journal"></div></div>
    <details class="card" id="scPanel" hidden><summary class="lbl" id="scSummary" style="cursor:pointer;margin:0"></summary>
      <div id="scList" style="margin-top:10px"></div>
      <div class="lbl" id="tManual" style="margin-top:14px"></div>
      <div class="sim" style="margin-top:6px">
        <select id="simPoint"></select><label class="percentage"><input id="simPct" type="number" min="0" max="100" value="96" style="width:64px">%</label><button id="simSet"></button>
      </div>
      <div class="sim" style="margin-top:8px"><button id="secMode" title=""></button></div>
      <div class="sim" style="margin-top:8px"><span id="simSpeedL" class="small"></span><select id="simSpeed"><option value="1">x1</option><option value="5">x5</option><option value="10">x10</option><option value="30">x30</option></select></div>
      <div class="sim" style="margin-top:8px"><label class="small" id="simApiL" for="simApi"></label><select id="simApi"></select><button id="roadRandom"></button><button id="reset"></button></div>
    </details>
  </section>
</main>

<div id="login"><form id="loginForm"><h2 id="loginTitle"></h2><input id="user" autocomplete="username"><input id="token" type="password" autocomplete="current-password"><button type="submit" id="loginSubmit"></button><div class="small" id="loginErr"></div></form></div>
<div id="toast" role="status" aria-live="polite"></div>

<script type="module">
import { api, esc, loadLang, name, pctColor, state, tr } from './common.js';

const $ = (id) => document.getElementById(id);
const TONE = { FIRE: ['#fdeceb', '#b4231a'], COLLAPSE: ['#fff1de', '#8f4700'], FLOOD: ['#e6f2fd', '#0a5cc2'], MEDICAL: ['#eaf7ee', '#0b7a42'] };
let token = sessionStorage.getItem('jwt') || ''; let me = null; let refreshTimer = null;
let snap = null; let snapAt = 0; let es = null; let roads = [];
let map; const L2 = {}; let rules = {};
const picks = {}; // alertId -> brigade the dispatcher chose (survives the 1 s live re-renders)
let bcBuiltFor = ''; // language + data the broadcast form was built for
let scenarios = [];
let replay = null;
let historyRequest = null;

await loadLang(localStorage.getItem('lang') || 'az');
$('lang').value = state.lang;
$('lang').addEventListener('change', () => act(async () => {
  $('lang').disabled = true;
  const swap = async () => {
    await loadLang($('lang').value); statics(); snap && render();
    const value = $('simPoint').value;
    $('simPoint').replaceChildren();
    if (snap) renderSide();
    $('simPoint').value = value;
    if (replay) showFrame(replay.i);
  };
  try {
    if (document.startViewTransition && !matchMedia('(prefers-reduced-motion: reduce)').matches) await document.startViewTransition(swap).finished;
    else await swap();
  } finally { $('lang').value = state.lang; $('lang').disabled = false; }
}));

function toast(msg, err = false) { const el = $('toast'); el.textContent = msg; el.className = `show ${err ? 'err' : ''}`; clearTimeout(toast.t); toast.t = setTimeout(() => { el.className = ''; }, 3200); }
const act = async (fn) => { try { await fn(); } catch (e) { toast(e.message, true); } };

function statics() {
  $('tAlerts').textContent = tr('d.alerts'); $('tCritical').textContent = tr('d.criticalFirst'); $('tFeed').textContent = tr('d.lastSignals');
  $('tPoints').textContent = tr('d.pointsTitle'); $('tBrigades').textContent = tr('d.brigadesTitle');
  $('tPend').textContent = tr('d.pending.title'); $('pendHint').textContent = tr('d.pending.hint');
  $('tSusp').textContent = tr('d.suspicious'); $('suspNote').textContent = tr('d.suspiciousNote');
  $('scSummary').textContent = tr('d.scenarios'); $('tManual').textContent = tr('d.manual');
  $('loginTitle').textContent = tr('d.login.title'); $('loginSubmit').textContent = tr('d.login.submit'); $('token').placeholder = tr('d.login.pass'); $('user').placeholder = tr('d.login.user'); $('logout').textContent = tr('d.logout');
  $('simSet').textContent = tr('d.sim.set'); $('simApiL').textContent = tr('d.sim.api'); $('tRouting').textContent = tr('d.sim.api');
  { const cur = $('simApi').value || snap?.chaos?.mode || 'ok'; $('simApi').innerHTML = ['ok', 'http503', 'slow', 'error'].map((m) => `<option value="${m}">${esc(tr('d.sim.api.' + m))}</option>`).join(''); $('simApi').value = cur; }

function drawFrame(f) {

  }

function frameAt(frames, position) {

}

  return `<article class="alert ${done ? 'done' : prio ? 'priority' : amber ? 'amber' : ''}" data-focus="${a.center.lat},${a.center.lng}">
    <div class="eyebrow"><span class="d"></span>${esc(single ? tr('d.single') : prio ? '♿ ' + tr('d.priority') : amber ? tr('d.warning') : tr('d.redAlerts'))} · ${esc(where)}<time>${esc(ago(a.createdAt))}</time></div>
    <div class="atitle">${esc(single ? fmt('d.dispatched', { name: snap.brigades.find((x) => x.id === a.result?.brigadeId)?.name ?? '-' }) : prio ? tr('alert.PRIORITY_SOS_TITLE') : amber ? tr('alert.POINT_FILLING_TITLE') : tr('alert.RED_DISPATCH_AND_OPEN_POINT'))}</div>
    <div style="font-size:13.5px;color:var(--muted)">${esc(title)}</div>
    ${prio ? `<div class="chips">${(a.needs ?? []).map((n) => `<span class="need">${esc(tr('m.need.' + n))}</span>`).join('')}</div>` : ''}${chips ? `<div class="chips">${chips}</div>` : ''}${planHtml}${picker}${actions}</article>`;
}

function renderAlerts(force = false) {
  if (!force && document.activeElement?.matches?.('#alerts select')) return; // never close a dropdown the dispatcher is using
  const list = snap.alerts.filter((a) => a.status !== 'expired').sort((x, y) => (x.status === 'open' ? 0 : 1) - (y.status === 'open' ? 0 : 1) || (y.type === 'PRIORITY_SOS') - (x.type === 'PRIORITY_SOS') || (x.level === 'amber') - (y.level === 'amber') || (y.reporters ?? y.occupancyPct) - (x.reporters ?? x.occupancyPct));
  const open = list.filter((a) => a.status === 'open').length;
  $('alertCount').textContent = open; $('alertCount').style.display = open ? '' : 'none';
  $('alerts').innerHTML = list.length ? list.map(alertCard).join('') : `<div class="card small">${esc(tr('ui.noAlerts'))}</div>`;
  $('alerts').querySelectorAll('[data-approve]').forEach((b) => b.addEventListener('click', (e) => { e.stopPropagation(); act(async () => {
    b.disabled = true;
    const sel = $('alerts').querySelector(`[data-pick="${b.dataset.approve}"]`); // the brigade shown in the picker is the one that goes
    try { await api('POST', `/api/alerts/${b.dataset.approve}/approve`, { token, body: sel ? { brigadeId: sel.value } : undefined }); }
    finally { b.disabled = false; }
  }); }));
  $('alerts').querySelectorAll('[data-pick]').forEach((sel) => { sel.addEventListener('click', (e) => e.stopPropagation()); sel.addEventListener('change', () => { picks[sel.dataset.pick] = sel.value; renderAlerts(true); }); });
  $('alerts').querySelectorAll('[data-undo]').forEach((b) => b.addEventListener('click', (e) => { e.stopPropagation(); act(async () => { b.disabled = true; await api('POST', `/api/alerts/${b.dataset.undo}/undo`, { token }); }); }));
  $('alerts').querySelectorAll('[data-focus]').forEach((c) => c.addEventListener('click', () => { const [la, ln] = c.dataset.focus.split(',').map(Number); map?.flyTo([la, ln], 15); }));
}
$('alerts').addEventListener('focusout', () => setTimeout(() => snap && renderAlerts(), 0)); // catch up on what was skipped while a dropdown was open
setInterval(() => { if (snap?.alerts.some((a) => a.status === 'approved' && a.undoMsLeft - (Date.now() - snapAt) > -1000)) renderAlerts(); }, 500);

function renderFeed() {
  const items = [...snap.sos].reverse().slice(0, 6);
  $('feed').innerHTML = items.length ? items.map((s) => `<div><i style="background:#ff3b30"></i><span>${esc(tr('sos.' + s.type))} · ${esc(zoneName(s.districtId))}${s.note ? ' · ' + esc(s.note) : ''}${s.priority === 1 ? ` <span class="need">♿ ${esc(tr('d.priority'))}</span>` : ''}${s.source === 'sms' ? ` <span class="need">${esc(tr('d.flag.sms'))}</span>` : ''}${s.verified ? '' : ` <span class="flagtag">${esc(tr('d.flag.unverified'))}</span>`}</span><small>${new Date(s.createdAt).toLocaleTimeString(state.lang, { hour: '2-digit', minute: '2-digit' })}</small></div>`).join('')
    : `<div class="small">${esc(tr('d.noSignals'))}</div>`;
}

function renderKpis() {
  const reds = snap.alerts.filter((a) => a.status === 'open' && a.level === 'red').length;
  const free = snap.brigades.filter((b) => b.status === 'available').length;
  const k = [[tr('d.openSos'), snap.sosTotalOpen, '#b4231a'], [tr('d.redAlerts'), reds, '#b4231a'], [tr('d.prioritySos'), snap.priorityOpen ?? 0, '#6d3fd8'], [tr('d.safe'), snap.safeCount, '#0b7a42'], [tr('d.freeBrigades'), `${free}/${snap.brigades.length}`, '#0b0b0f']];
  $('kpis').innerHTML = k.map(([l, v, c]) => `<div class="kpi"><small>${esc(l)}</small><div><b style="color:${c}">${v}</b></div></div>`).join('');
}

function renderSide() {
  $('points').innerHTML = snap.points.filter((p) => p.active).sort((a, b) => b.occupancyPct - a.occupancyPct).map((p) =>
    `<div class="prow"><div><span>${esc(name(p.name))}</span><b style="color:${pctColor(p.occupancyPct)}">${p.occupancyPct}%</b></div><div class="bar"><i style="width:${Math.min(100, p.occupancyPct)}%;background:${pctColor(p.occupancyPct)}"></i></div></div>`).join('');
  const bs = { available: ['#e6f6ec', '#0b7a42'], dispatched: ['#e6f2fd', '#0a5cc2'], on_scene: ['#e6f2fd', '#0a5cc2'], returning: ['#fff4de', '#8a5a00'], offline: ['#f4f5f7', '#5f6470'] };
  const left = (b) => (b.etaSec == null ? null : Math.max(0, b.etaSec - Math.floor((Date.now() - snapAt) / 1000)));
  const mmss = (s) => `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
  $('brigades').innerHTML = snap.brigades.map((b) => {
    const eta = left(b);
    return `<div class="brow" style="flex-wrap:wrap"><span>${esc(b.name)}${b.kind === 'accessible_transport' ? ` <span class="accfeat">♿ ${esc(tr('d.accessibleTag'))}</span>` : ''}</span><span style="display:flex;gap:6px;align-items:center">${eta != null ? `<small style="color:var(--muted)">${mmss(eta)}</small>` : ''}<span class="state" style="background:${bs[b.status][0]};color:${bs[b.status][1]}">${esc(tr('brigade.' + b.status))}</span>${b.status !== 'available' ? `<button data-free="${b.id}" title="${esc(tr('d.freeUp'))}" style="border:1px solid var(--line);background:#fff;border-radius:8px;padding:2px 8px">✓</button>` : ''}</span>${b.progress != null ? `<div class="mv" style="flex-basis:100%"><i style="width:${Math.round(b.progress * 100)}%"></i></div>` : ''}</div>`;
  }).join('');
  $('brigades').querySelectorAll('[data-free]').forEach((b) => b.addEventListener('click', () => act(() => api('POST', `/api/brigades/${b.dataset.free}/status`, { token, body: { status: 'available' } }))));
  const sel = $('simPoint'); if (!sel.options.length) sel.innerHTML = snap.points.filter((p) => p.active).map((p) => `<option value="${p.id}">${esc(name(p.name))}</option>`).join('');
}

// ---------------------------------------------------------------- external map API health (circuit breaker)
function routingErr(br) {
  const e = br.lastError;
  if (!e) return '';
  const key = e.kind === 'http' ? 'd.routing.err.http' : 'd.routing.err.' + (['timeout', 'network'].includes(e.kind) ? e.kind : 'error');
  return fmt(key, { status: e.status ?? '' });
}
function renderRouting(apiDown) {
  const rt = snap.deps?.routing;
  const pill = $('apiPill');
  if (!rt) { pill.className = `pill ${apiDown ? 'bad' : 'ok'}`; pill.textContent = apiDown ? tr('d.apiDown') : tr('d.apiOk'); return; }
  const br = rt.breaker;
  const left = br.retryInMs ? Math.max(0, Math.ceil((br.retryInMs - (Date.now() - snapAt)) / 1000)) : 0;
  const degraded = rt.mode === 'offline-fallback';
  pill.className = `pill ${degraded ? 'warn' : 'ok'}`;
  pill.innerHTML = degraded ? `<span class="dotw"></span>${esc(tr('d.routing.degraded'))}${br.state === 'open' ? ` · ${esc(fmt('d.routing.retry', { s: left }))}` : ''}` : esc(tr('d.apiOk'));
  pill.title = degraded ? routingErr(br) : '';
  $('routing').innerHTML = `
    <div class="row"><span>${esc(tr('d.sim.api'))}</span><b>${esc(tr('d.routing.state.' + br.state))}</b></div>
    ${br.lastError && (degraded || br.state !== 'closed') ? `<div class="row"><span>⚠</span><span>${esc(routingErr(br))}</span></div>` : ''}
    ${br.state === 'open' ? `<div class="row"><span>${esc(fmt('d.routing.retry', { s: left }))}</span><span></span></div>` : ''}
    <div class="row"><span>${esc(fmt('d.routing.cache', { n: rt.cacheSize }))}</span><span>${esc(fmt('d.routing.fails', { f: br.failures, c: br.calls }))}</span></div>
    <div class="srcs">${['external', 'cache', 'matrix', 'local'].map((k) => `<span>${esc(tr('d.routing.src.' + k))}: ${rt.served[k] ?? 0}</span>`).join('')}</div>`;
}

// ---------------------------------------------------------------- mass notification (dispatcher -> citizens)
const BC_TYPES = ['evacuate', 'shelter', 'avoid_area', 'all_clear', 'custom'];
const topAlert = () => snap?.alerts.find((a) => a.status === 'open');
function bcTargetObj() {
  const t = $('bcTarget').value;
  if (t === 'district') return { kind: 'districts', districts: [$('bcDistrict').value] };
  if (t === 'radius') { const a = topAlert(); return a ? { kind: 'radius', lat: a.center.lat, lng: a.center.lng, radiusM: 1000 } : { kind: 'all' }; }
  return { kind: 'all' };
}
function buildBcForm() {
  if (!snap) return;
  const keep = { type: $('bcType').value, target: $('bcTarget').value, district: $('bcDistrict').value, point: $('bcPoint').value };
  $('bcType').innerHTML = BC_TYPES.map((t) => `<option value="${t}">${esc(tr('bc.type.' + t))}</option>`).join('');
  $('bcTarget').innerHTML = [['all', 'd.bc.target.all'], ['district', 'd.bc.target.district'], ['radius', 'd.bc.target.radius']].map(([v, k]) => `<option value="${v}">${esc(tr(k))}</option>`).join('');
  $('bcDistrict').innerHTML = snap.zones.map((z) => `<option value="${z.id}">${esc(name(z.name))}</option>`).join('');
  $('bcPoint').innerHTML = snap.points.filter((p) => p.active).map((p) => `<option value="${p.id}">${esc(name(p.name))}</option>`).join('');
  for (const [id, v] of [['bcType', keep.type], ['bcTarget', keep.target], ['bcDistrict', keep.district], ['bcPoint', keep.point]]) if (v) $(id).value = v;
  bcBuiltFor = state.lang + snap.points.length + snap.zones.length;
  bcSync();
}
function bcSync() {
  const type = $('bcType').value;
  $('bcDistrict').hidden = $('bcTarget').value !== 'district';
  $('bcPointRow').hidden = type !== 'evacuate';
  $('bcTextRow').hidden = type !== 'custom';
  let prev = '';
  if (type === 'custom') prev = $('bcTextAz').value || $('bcTextEn').value;
  else {
    const p = snap?.points.find((x) => x.id === $('bcPoint').value);
    prev = `${tr('bc.' + type + '.title').replace('{point}', p ? name(p.name) : '…')}. ${tr('bc.' + type + '.body')}`;
  }
  $('bcPreview').textContent = prev ? `${tr('d.bc.preview')}: ${prev}` : '';
}
for (const id of ['bcType', 'bcTarget', 'bcDistrict', 'bcPoint', 'bcTextAz', 'bcTextEn']) $(id).addEventListener('input', bcSync);
$('bcSend').addEventListener('click', () => act(async () => {
  const type = $('bcType').value;
  const body = { type, target: bcTargetObj() };
  if (type === 'evacuate') body.pointId = $('bcPoint').value;
  if (type === 'custom') { body.severity = 'warning'; body.text = { az: $('bcTextAz').value, en: $('bcTextEn').value }; }
  if (!window.confirm(`${tr('d.bc.confirm')}\n\n${$('bcPreview').textContent}`)) return;
  await api('POST', '/api/broadcasts', { token, body });
  toast(tr('d.bc.sent'));
  if (type === 'custom') { $('bcTextAz').value = ''; $('bcTextEn').value = ''; bcSync(); }
}));
function bcTargetLabel(t) {
  if (t.kind === 'all') return tr('d.bc.target.all');
  if (t.kind === 'districts') return t.districts.map((id) => name(snap.zones.find((z) => z.id === id)?.name) ?? id).join(', ');
  return `${t.radiusM / 1000} km`;
}
function renderBcHistory() {
  const list = snap.broadcasts ?? [];
  $('bcHistory').innerHTML = list.length ? list.map((b) => `<div class="bch"><b>${esc(tr('bc.type.' + b.type))} · ${esc(bcTargetLabel(b.target))}</b>
    <div class="meta"><span>${b.reach} ${esc(tr('d.bc.reach'))} · ${b.acks} ${esc(tr('d.bc.acks'))} · ${esc(tr('d.bc.' + (b.status === 'active' ? 'active' : b.status)))}</span>${b.status === 'active' ? `<button class="rel" data-bc-cancel="${b.id}">${esc(tr('d.bc.cancel'))}</button>` : ''}</div></div>`).join('')
    : `<div class="small">${esc(tr('d.bc.none'))}</div>`;
  $('bcHistory').querySelectorAll('[data-bc-cancel]').forEach((b) => b.addEventListener('click', () => act(async () => { b.disabled = true; await api('POST', `/api/broadcasts/${b.dataset.bcCancel}/cancel`, { token }); })));
}

// ---------------------------------------------------------------- decision journal
function renderJournal() {
  const items = snap.decisions ?? [];
  const extra = (d) => d.details?.manual ? ` · ${d.details.brigadeId} · ${tr('d.manualPick')}` : d.details?.brigadeId ? ` · ${d.details.brigadeId}` : d.details?.name ? ` · ${d.details.name}` : d.details?.status ? ` · ${tr('brigade.' + d.details.status)}` : d.details?.type && d.action.startsWith('broadcast') ? ` · ${tr('bc.type.' + d.details.type)}` : d.details?.type && d.action === 'alert.created' ? ` · ${d.details.type === 'PRIORITY_SOS' ? tr('d.priority') : d.details.type === 'SOS_CLUSTER' ? tr('alert.SOS_CLUSTER') : tr('alert.POINT_OVERCROWD')}` : '';
  $('journal').innerHTML = items.length ? items.slice(0, 10).map((d) => `<div><i style="background:${d.actor === 'system' ? '#94a3b8' : '#0071e3'}"></i><span><b>${esc(tr('audit.' + d.action))}</b>${esc(extra(d))}<br><small>${esc(tr('role.' + d.actor))}</small></span><small>${new Date(d.t).toLocaleTimeString(state.lang, { hour: '2-digit', minute: '2-digit', second: '2-digit' })}</small></div>`).join('')
    : `<div class="small">${esc(tr('d.noDecisions'))}</div>`;
}

// brigades move: refresh countdowns/progress once a second while any of them is on the road
setInterval(() => { if (snap && snap.brigades.some((b) => b.etaSec != null) && !replay) renderSide(); if (snap?.deps?.routing.breaker.state === 'open') renderRouting(false); }, 1000);

// ---------------------------------------------------------------- map
function ensureMap() {
  if (map || typeof L === 'undefined') return;
  map = L.map('map', { zoomControl: true }).setView([40.41, 49.87], 12);
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 18, attribution: '© OpenStreetMap' }).addTo(map);
  for (const k of ['roads', 'zones', 'points', 'sos', 'brigades']) L2[k] = L.layerGroup().addTo(map);
}
function drawMap() {
  ensureMap(); if (!map) return;
  if (replay) return; // time machine owns the map while active
  Object.values(L2).forEach((l) => l.clearLayers());
  for (const r of roads) if (r.closed) L.polyline([[r.from.lat, r.from.lng], [r.to.lat, r.to.lng]], { color: '#e5352b', weight: 5, dashArray: '9 8' }).on('click', () => act(async () => { await api('POST', `/api/roads/${r.id}/open`, { token }); })).addTo(L2.roads);
  for (const z of snap.zones) L.circle([z.lat, z.lng], { radius: 500, color: z.openSos ? '#ff3b30' : '#94a3b8', weight: z.openSos ? 2 : 1, fillOpacity: z.openSos ? 0.12 : 0.03 }).bindTooltip(`${name(z.name)}: ${z.openSos} SOS`).addTo(L2.zones);
  for (const p of snap.points) L.circleMarker([p.lat, p.lng], { radius: p.active ? 12 : 6, color: '#fff', weight: 3, fillColor: p.active ? pctColor(p.occupancyPct) : '#9ca3af', fillOpacity: 1 }).bindTooltip(`${name(p.name)} ${p.occupancyPct}%`).addTo(L2.points);
  for (const s of snap.sos) {
    const pr = s.priority === 1;
    L.circleMarker([s.lat, s.lng], { radius: pr ? 10 : 6, color: pr ? '#43228a' : '#fff', weight: pr ? 3 : 2, fillColor: pr ? '#7c3aed' : '#ff3b30', fillOpacity: 1 }).bindTooltip(`${pr ? '♿ ' + tr('d.priority') + ' · ' : ''}${tr('sos.' + s.type)}${s.note ? ': ' + s.note : ''}`).addTo(L2.sos);
  }
  for (const b of snap.brigades) {
    L.marker([b.lat, b.lng], { icon: L.divIcon({ className: '', iconSize: [22, 22], html: `<div style="width:22px;height:22px;border-radius:6px;background:${b.kind === 'accessible_transport' ? '#6d3fd8' : '#0071e3'};border:3px solid #fff;opacity:${b.status === 'available' ? 1 : .6}"></div>` }) }).bindTooltip(`${b.name} · ${tr('brigade.' + b.status)}`).addTo(L2.brigades);
    if (b.target) L.polyline([[b.lat, b.lng], [b.target.lat, b.target.lng]], { color: '#0071e3', dashArray: '3 8', weight: 4 }).addTo(L2.brigades);
  }
  for (const a of snap.alerts.filter((x) => x.status === 'open' && x.plan?.brigade)) {
    const b = snap.brigades.find((x) => x.id === a.plan.brigade.id);
    if (b) L.polyline([[b.lat, b.lng], [a.center.lat, a.center.lng]], { color: '#0071e3', dashArray: '3 8', weight: 3, opacity: .6 }).addTo(L2.brigades);
  }
}

// ---------------------------------------------------------------- simulation (admin token)
const sim = (fn) => () => act(fn);
$('simSet').addEventListener('click', sim(async () => { const pt = snap.points.find((p) => p.id === $('simPoint').value); await api('POST', '/api/sim/occupancy', { token, body: { pointId: pt.id, occupied: Math.round((Number($('simPct').value) / 100) * pt.capacity) } }); }));
$('simApi').addEventListener('change', sim(() => api('POST', '/api/sim/chaos', { token, body: { mode: $('simApi').value } })));
$('roadRandom').addEventListener('click', sim(async () => { const open = roads.filter((r) => !r.closed); const r = open[Math.floor(Math.random() * open.length)]; await api('POST', `/api/roads/${r.id}/close`, { token }); }));
$('reset').addEventListener('click', sim(() => api('POST', '/api/sim/reset', { token })));
$('simSpeed').addEventListener('change', sim(async () => { rules = await api('POST', '/api/sim/rules', { token, body: { brigadeTimeScale: Number($('simSpeed').value) } }); }));

if (token) connect(); else showLogin();
</script>
</body>
</html>
