<!doctype html>
<html lang="az">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Urban Crisis Engine</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="/style.css">
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>
<body>
<header>
  <h1 data-i18n="app.title">…</h1>
  <nav><a href="/" data-i18n="ui.citizen">Vətəndaş</a><a href="/dispatcher" data-i18n="ui.dispatcher">Dispetçer</a></nav>
  <select id="lang"><option value="az">AZ</option><option value="en">EN</option><option value="ru">RU</option></select>
</header>
<main>
  <section class="panel">
    <div class="card">
      <h2 data-i18n="ui.myLocation">…</h2>
      <div class="row">
        <button id="geo" class="primary">📍 GPS</button>
        <select id="district"></select>
      </div>
      <p class="muted" data-i18n="ui.pickOnMap">…</p>
    </div>

    <div class="card">
      <h2>SOS</h2>
      <div class="sos-grid" id="sosButtons"></div>
      <input id="note" style="width:100%;margin-top:8px" maxlength="280" data-i18n-ph="ui.note">
      <button id="safe" class="safe" style="width:100%;margin-top:8px" data-i18n="ui.imSafe">…</button>
    </div>

    <div class="card">
      <div id="banners"></div>
      <div id="points"></div>
    </div>
  </section>
  <div id="map"></div>
</main>
<div id="toast" class="toast"></div>

<script type="module">
import { api, citizenId, esc, initMap, langSwitcher, loadLang, name, pctColor, toast, tr } from './common.js';

const ICONS = { FIRE: '🔥', COLLAPSE: '🏚️', FLOOD: '🌊', MEDICAL: '🚑' };
let pos = null;            // {lat,lng}
let lastRec = null;
let lastRecId = null;
let map, layer, youMarker;

await loadLang(localStorage.getItem('lang') || 'az');
langSwitcher(document.getElementById('lang'), () => { buildButtons(); renderDistricts(); render(); });

const districts = await api('GET', '/api/districts');
function renderDistricts() {
  const sel = document.getElementById('district');
  const cur = sel.value;
  sel.innerHTML = `<option value="">${esc(tr('ui.district'))}…</option>` +
    districts.map((d) => `<option value="${d.id}">${esc(name(d.name))}</option>`).join('');
  sel.value = cur;
}
renderDistricts();

function buildButtons() {
  const box = document.getElementById('sosButtons');
  box.innerHTML = Object.keys(ICONS).map((k) => `<button class="danger" data-type="${k}">${ICONS[k]} ${esc(tr('sos.' + k))}</button>`).join('');
  box.querySelectorAll('button').forEach((b) => b.addEventListener('click', () => sendSos(b.dataset.type)));
}
buildButtons();

map = initMap(document.getElementById('map'));
if (map) {
  layer = L.layerGroup().addTo(map);
  map.on('click', (e) => setPos({ lat: e.latlng.lat, lng: e.latlng.lng }));
  const roads = await api('GET', '/api/roads').catch(() => []);
  L.layerGroup(roads.filter((r) => r.closed).map((r) => L.polyline([[r.from.lat, r.from.lng], [r.to.lat, r.to.lng]], { color: '#dc2626', dashArray: '6 6' }))).addTo(map);
}

document.getElementById('geo').addEventListener('click', () => {
  navigator.geolocation?.getCurrentPosition(
    (p) => setPos({ lat: p.coords.latitude, lng: p.coords.longitude }),
    () => toast('GPS unavailable', 'err'),
  );
});
document.getElementById('district').addEventListener('change', (e) => {
  const d = districts.find((x) => x.id === e.target.value);
  if (d) setPos({ lat: d.lat, lng: d.lng });
});

function setPos(p) { pos = p; refresh(); }

async function refresh() {
  if (!pos) return;
  try { lastRec = await api('GET', `/api/evacuation?lat=${pos.lat}&lng=${pos.lng}`); } catch (e) { toast(e.message, 'err'); return; }
  render();
}

function render() {
  if (!lastRec) return;
  const r = lastRec;
  const banners = [];
  if (r.rerouted) {
    for (const reason of r.rerouted.reasons.filter((x) => x !== 'SHORTER_ROUTE')) {
      banners.push(`<div class="banner">⚠️ ${esc(tr('ui.reroute.' + reason))}</div>`);
    }
  }
  if (r.noSafePoint) banners.push(`<div class="banner">${esc(tr('ui.noSafePoint'))}</div>`);
  const rec = r.points.find((p) => p.id === r.recommendedPointId);
  if (rec?.route?.source === 'fallback') banners.push(`<div class="banner info">ℹ️ ${esc(tr('ui.source.fallback'))}</div>`);
  document.getElementById('banners').innerHTML = banners.join('');

  document.getElementById('points').innerHTML = r.points.map((p) => `
    <div class="point ${p.id === r.recommendedPointId ? 'rec' : ''} ${p.status === 'full' || p.status === 'unreachable' ? 'bad' : ''}">
      <div class="row" style="justify-content:space-between">
        <strong>${esc(name(p.name))}</strong>
        <span class="badge" style="background:${p.status === 'unreachable' ? '#6b7280' : pctColor(p.occupancyPct)}">${esc(tr('ui.status.' + p.status))}</span>
      </div>
      <div class="muted">${esc(tr('point.' + p.type))}${p.route ? ` · ${p.route.distanceM} ${esc(tr('ui.meters'))} · ~${p.route.etaMin} ${esc(tr('ui.eta'))}` : ''}${p.id === r.recommendedPointId ? ` · ✅ ${esc(tr('ui.recommended'))}` : ''}</div>
      <div class="bar"><i style="width:${Math.min(100, p.occupancyPct)}%;background:${pctColor(p.occupancyPct)}"></i></div>
      <div class="row" style="justify-content:space-between"><span class="muted">${esc(tr('ui.occupancy'))}: ${p.occupancyPct}% (${p.occupied}/${p.capacity})</span>
        ${p.status === 'open' || p.status === 'filling' ? `<button data-checkin="${p.id}">${esc(tr('ui.checkin'))}</button>` : ''}</div>
    </div>`).join('');
  document.querySelectorAll('[data-checkin]').forEach((b) => b.addEventListener('click', () => checkin(b.dataset.checkin)));

  drawMap(r);
  if (lastRecId && r.recommendedPointId && lastRecId !== r.recommendedPointId) toast('🔁 ' + (r.rerouted ? tr('ui.reroute.' + (r.rerouted.reasons[0] === 'SHORTER_ROUTE' ? 'POINT_FULL' : r.rerouted.reasons[0])) : ''), 'err');
  lastRecId = r.recommendedPointId;
}

function drawMap(r) {
  if (!map) return;
  layer.clearLayers();
  if (youMarker) youMarker.remove();
  youMarker = L.circleMarker([r.origin.lat, r.origin.lng], { radius: 8, color: '#2563eb', fillOpacity: 1 }).addTo(map);
  for (const p of r.points) {
    const isRec = p.id === r.recommendedPointId;
    L.circleMarker([p.lat, p.lng], { radius: isRec ? 12 : 8, color: pctColor(p.occupancyPct), fillOpacity: .8 })
      .bindTooltip(`${name(p.name)} – ${p.occupancyPct}%`).addTo(layer);
    if (isRec && p.route) {
      L.polyline(p.route.geometry.map((g) => [g.lat, g.lng]), { color: '#16a34a', weight: 5 }).addTo(layer);
      map.fitBounds(L.latLngBounds(p.route.geometry.map((g) => [g.lat, g.lng])).pad(0.3));
    }
  }
}

async function sendSos(type) {
  if (!pos) { toast(tr('ui.pickOnMap'), 'err'); return; }
  try {
    await api('POST', '/api/sos', { body: { citizenId: citizenId(), type, lat: pos.lat, lng: pos.lng, note: document.getElementById('note').value } });
    toast(`${ICONS[type]} ${tr('ui.sosSent')}`);
  } catch (e) { toast(e.message, 'err'); }
}
document.getElementById('safe').addEventListener('click', async () => {
  try { await api('POST', '/api/safe', { body: { citizenId: citizenId(), ...(pos ?? {}) } }); toast(tr('ui.safeSent')); }
  catch (e) { toast(e.message, 'err'); }
});
async function checkin(id) {
  try { await api('POST', `/api/points/${id}/checkin`, { body: { citizenId: citizenId() } }); toast(tr('ui.checkedIn')); refresh(); }
  catch (e) { toast(e.message, 'err'); refresh(); }
}

setInterval(refresh, 5000); // picks up closed roads / filling points automatically
</script>
</body>
</html>
