<!doctype html>
<html lang="az" translate="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="google" content="notranslate">
<meta name="theme-color" content="#F7F7FB">
<title>cellsign.tech</title>
<link rel="icon" href="icon.svg">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Plus+Jakarta+Sans:wght@700;800&amp;display=swap">
<style>
  /* Motion: emil-design-eng (strong ease-out, UI under 300ms, scale(.97) on press, enter from .95 + opacity, one orchestrated entrance).
     Copy: anti-slop rules (headings name the content, claims end on a number or a rule, no em dashes, no repeated section template). */
  :root { --crimson:#D0103A; --crimson-600:#B50D33; --crimson-50:#FDEBEF; --ink:#161C2D; --ink-2:#313A51; --muted:#626B80; --soft:#F2F3F8; --surface:#F7F7FB; --line:#E3E5EE;
          --green:#0E9F6E; --green-ink:#006C49; --green-50:#E3F5EC; --amber:#F59E0B; --blue:#1F6FEB; --violet-ink:#43228A; --violet-50:#F3EDFF; --night:#0D1626;
          --ease-out:cubic-bezier(0.23, 1, 0.32, 1);
          --head:'Plus Jakarta Sans','Inter',system-ui,sans-serif; --body:'Inter',system-ui,sans-serif; }
  * { box-sizing:border-box; }
  html { scroll-behavior:smooth; }
  body { margin:0; background:var(--surface); color:var(--ink); font:16px/1.55 var(--body); -webkit-font-smoothing:antialiased; }
  a { color:inherit; text-decoration:none; }
  :focus-visible { outline:3px solid var(--blue); outline-offset:3px; border-radius:8px; }
  .wrap { max-width:1140px; margin:0 auto; padding:0 24px; }

  nav { position:sticky; top:0; z-index:50; background:rgba(247,247,251,.84); backdrop-filter:saturate(1.4) blur(12px); border-bottom:1px solid transparent; transition:border-color 200ms var(--ease-out); }
  nav.scrolled { border-bottom-color:var(--line); }
  nav .wrap { display:flex; align-items:center; gap:22px; height:68px; }
  .mark { display:flex; align-items:center; gap:10px; font:800 21px var(--head); letter-spacing:-0.04em; white-space:nowrap; }
  .mark img { width:32px; height:32px; border-radius:9px; box-shadow:0 6px 16px rgba(208,16,58,.3); }
  .mark i { font-style:normal; color:var(--crimson); }
  nav .links { display:flex; gap:20px; margin-left:auto; font-size:14.5px; color:var(--muted); font-weight:500; }
  nav .links a { transition:color 160ms var(--ease-out); } nav .links a:hover { color:var(--ink); }
  .seg { position:relative; display:flex; padding:3px; border-radius:999px; background:#fff; border:1px solid var(--line); }
  .seg button { position:relative; z-index:1; border:0; background:none; color:var(--muted); font:700 12.5px var(--head); padding:6px 11px; border-radius:999px; cursor:pointer; transition:color 200ms var(--ease-out); }
  .seg button[aria-checked="true"] { color:#fff; }
  .seg .thumb { position:absolute; top:3px; bottom:3px; left:0; border-radius:999px; background:var(--ink); transition:transform 260ms var(--ease-out), width 260ms var(--ease-out); }
  .btn { display:inline-flex; align-items:center; justify-content:center; height:48px; padding:0 20px; border-radius:14px; font:700 15.5px var(--head); letter-spacing:-0.01em; border:0; cursor:pointer; white-space:nowrap;
         transition:transform 160ms var(--ease-out), background-color 200ms var(--ease-out), border-color 200ms var(--ease-out); }
  .btn:active { transform:scale(0.97); }
  .btn.sos { background:var(--crimson); color:#fff; box-shadow:0 10px 24px rgba(208,16,58,.3); } .btn.sos:hover { background:var(--crimson-600); }
  .btn.dark { background:var(--ink); color:#fff; } .btn.ghost { background:#fff; border:1.5px solid var(--line); } .btn.ghost:hover { border-color:#C9CDD8; }
  .btn.sm { height:40px; padding:0 16px; font-size:14px; border-radius:12px; }

  .hero { padding:64px 0 72px; background:radial-gradient(60% 70% at 85% 10%, rgba(208,16,58,.08), transparent 70%); }
  .hero .wrap { display:grid; grid-template-columns:1.15fr .85fr; gap:56px; align-items:center; }
  .badge { display:inline-flex; align-items:center; gap:8px; padding:6px 12px 6px 9px; border-radius:999px; background:#fff; border:1px solid var(--line); font-size:13px; color:var(--ink-2); font-weight:500; }
  .badge .live { width:8px; height:8px; border-radius:50%; background:var(--green); animation:live 1.8s infinite; }
  @keyframes live { 0% { box-shadow:0 0 0 0 rgba(14,159,110,.5); } 70%,100% { box-shadow:0 0 0 7px rgba(14,159,110,0); } }
  h1 { margin:18px 0 0; font:800 clamp(34px, 4.4vw, 54px)/1.04 var(--head); letter-spacing:-0.045em; max-width:15em; }
  .lead { margin:20px 0 0; font-size:18px; color:var(--muted); max-width:36em; }
  .ctas { display:flex; gap:12px; margin-top:28px; flex-wrap:wrap; }
  .stats { display:flex; gap:32px; margin-top:36px; flex-wrap:wrap; }
  .stat b { display:block; font:800 30px var(--head); letter-spacing:-0.04em; font-variant-numeric:tabular-nums; } .stat span { font-size:13.5px; color:var(--muted); }

  /* the phone runs the real citizen app (390x844 viewport, scaled to fit the frame) */
  .device { justify-self:center; display:flex; flex-direction:column; align-items:center; gap:14px; }
  .phone { position:relative; width:304px; height:640px; border-radius:48px; background:var(--ink); padding:12px; box-shadow:0 40px 90px rgba(22,28,45,.28), inset 0 0 0 2px #2A3248; }
  .screen { position:relative; width:280px; height:616px; border-radius:38px; overflow:hidden; background:#fff; }
  .screen iframe { position:absolute; top:0; left:0; width:390px; height:858px; border:0; transform:scale(0.7179); transform-origin:0 0; background:#F7F7FB; }
  .notch { position:absolute; z-index:2; top:20px; left:50%; width:86px; height:24px; border-radius:20px; background:var(--ink); transform:translateX(-50%); pointer-events:none; }
  .device small { color:var(--muted); font-size:13px; }

  section { padding:88px 0; }
  .kicker { color:var(--crimson); font-weight:700; font-size:14px; }
  h2 { margin:8px 0 0; font:800 clamp(28px, 3.2vw, 38px)/1.1 var(--head); letter-spacing:-0.035em; }
  .sub { color:var(--muted); font-size:17px; max-width:40em; margin:12px 0 0; }
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-top:40px; }
  .card { background:#fff; border:1px solid var(--line); border-radius:22px; padding:24px 26px; display:flex; gap:18px; align-items:flex-start; transition:transform 200ms var(--ease-out), box-shadow 200ms var(--ease-out); }
  @media (hover:hover) { .card:hover { transform:translateY(-2px); box-shadow:0 16px 36px rgba(22,28,45,.08); } }
  .card .ico { width:46px; height:46px; border-radius:14px; display:flex; align-items:center; justify-content:center; flex:none; }
  .card h3 { margin:0; font:800 18.5px var(--head); letter-spacing:-0.025em; } .card p { margin:6px 0 0; color:var(--muted); font-size:15px; }

  .night { background:var(--night); color:#E7EEF8; border-radius:32px; margin:0 24px; padding:72px 0; position:relative; overflow:hidden; }
  .night::after { content:''; position:absolute; right:-140px; top:-140px; width:440px; height:440px; border-radius:50%; background:repeating-radial-gradient(circle, rgba(255,255,255,.05) 0 1px, transparent 1px 22px); pointer-events:none; }
  .night .two { display:grid; grid-template-columns:1.05fr .95fr; gap:52px; align-items:center; }
  .night h2 { color:#fff; } .night .sub { color:#9DAECB; } .night .kicker { color:#FF8FA5; }
  .checks { list-style:none; padding:0; margin:26px 0 0; display:flex; flex-direction:column; gap:12px; }
  .checks li { display:flex; gap:12px; font-size:15.5px; color:#C7D2E5; } .checks svg { flex:none; margin-top:4px; }
  .ticket { border-radius:20px; padding:18px 18px 18px 22px; background:#1A2A44; border:1px solid #253858; position:relative; max-width:440px; justify-self:center; width:100%; }
  .ticket::before { content:''; position:absolute; left:0; top:16px; bottom:16px; width:4px; border-radius:0 4px 4px 0; background:#F0335A; }
  .ticket .h { display:flex; gap:8px; font-size:13px; color:#8EA0BD; } .ticket .h b { color:#FF8FA5; } .ticket .h span:last-child { margin-left:auto; }
  .ticket .t { font:700 17px/1.3 var(--head); margin-top:8px; color:#fff; } .ticket .s { font-size:13.5px; color:#8EA0BD; margin-top:4px; }
  .ticket .plan { margin-top:12px; background:rgba(5,10,20,.4); border-radius:12px; padding:10px 12px; font-size:13.5px; display:flex; flex-direction:column; gap:6px; }
  .ticket .plan i { display:inline-block; width:8px; height:8px; border-radius:2px; margin-right:8px; }
  .ticket button { margin-top:12px; height:46px; width:100%; border:0; border-radius:12px; background:#F0335A; color:#fff; font:700 15px var(--head); transition:transform 160ms var(--ease-out); cursor:pointer; }
  .ticket button:active { transform:scale(0.97); }

  .fails { list-style:none; padding:0; margin:30px 0 0; border-top:1px solid var(--line); }
  .fails li { padding:16px 0; border-bottom:1px solid var(--line); font-size:16px; color:var(--ink-2); }
  .steps { display:grid; grid-template-columns:repeat(3, 1fr); gap:28px; margin-top:48px; counter-reset:s; }
  .step { position:relative; padding-top:54px; }
  .step::before { counter-increment:s; content:counter(s); position:absolute; top:0; left:0; width:38px; height:38px; border-radius:12px; background:var(--ink); color:#fff; display:flex; align-items:center; justify-content:center; font:800 16px var(--head); }
  .step h3 { margin:0; font:800 18.5px var(--head); } .step p { margin:6px 0 0; color:var(--muted); font-size:15px; }
  .final { text-align:center; padding:88px 0 96px; } .final .sub { margin:12px auto 0; } .final .ctas { justify-content:center; }
  footer { border-top:1px solid var(--line); padding:24px 0; color:var(--muted); font-size:13.5px; } footer .wrap { display:flex; justify-content:space-between; gap:12px; flex-wrap:wrap; } footer a { margin-left:16px; }

  .in { opacity:0; transform:translateY(10px) scale(0.98); animation:enter 600ms var(--ease-out) forwards; }
  .in.d1 { animation-delay:60ms; } .in.d2 { animation-delay:120ms; } .in.d3 { animation-delay:180ms; } .in.d4 { animation-delay:240ms; }
  .device.in { transform:translateY(16px) scale(0.95); animation-duration:800ms; animation-delay:120ms; }
  @keyframes enter { to { opacity:1; transform:none; } }
  .reveal { opacity:0; transform:translateY(14px); transition:opacity 500ms var(--ease-out), transform 500ms var(--ease-out); }
  .reveal.seen { opacity:1; transform:none; }
  ::view-transition-old(root) { animation:vt-out 160ms var(--ease-out) both; } ::view-transition-new(root) { animation:vt-in 260ms var(--ease-out) both; }
  @keyframes vt-out { to { opacity:0; filter:blur(3px); } } @keyframes vt-in { from { opacity:0; filter:blur(3px); } }

  @media (max-width:920px) { .hero .wrap, .night .two, .grid2 { grid-template-columns:1fr; } .steps { grid-template-columns:1fr; } nav .links { display:none; } .night { margin:0 12px; border-radius:24px; } }
  @media (max-width:520px) { .seg button { padding:6px 8px; } nav .btn.sm { display:none; } }
  @media (prefers-reduced-motion:reduce) { *, *::before, *::after { animation:none !important; transition:none !important; } .in, .reveal { opacity:1; transform:none; } }
</style>
</head>
<body>

<nav id="nav"><div class="wrap">
  <a class="mark" href="landing.html"><img src="icon.svg" alt="">cellsign<i>.tech</i></a>
  <div class="links"><a href="#citizen" data-i18n="l.nav.how"></a><a href="#dispatch" data-i18n="l.nav.dispatch"></a><a href="#failures" data-i18n="l.nav.res"></a></div>
  <div class="seg" id="langSeg" role="radiogroup" aria-label="Language"><span class="thumb"></span><button role="radio" data-l="az">AZ</button><button role="radio" data-l="en">EN</button><button role="radio" data-l="ru">RU</button></div>
  <a class="btn dark sm" href="mobile" data-i18n="l.nav.open"></a>
</div></nav>

<header class="hero"><div class="wrap">
  <div>
    <span class="badge in"><span class="live"></span><span data-i18n="l.badge"></span></span>
    <h1 class="in d1" data-i18n="l.h1"></h1>
    <p class="lead in d2" data-i18n="l.lead"></p>
    <div class="ctas in d3"><a class="btn sos" href="mobile" data-i18n="l.cta.sos"></a><a class="btn ghost" href="dispatcher" data-i18n="l.cta.disp"></a></div>
    <div class="stats in d4">
      <div class="stat"><b id="sPoints">8</b><span data-i18n="l.stat.points"></span></div>
      <div class="stat"><b id="sCap">67,850</b><span data-i18n="l.stat.cap"></span></div>
      <div class="stat"><b id="sFree">88%</b><span data-i18n="l.stat.free"></span></div>
    </div>
  </div>
  <div class="device in">
    <div class="phone"><div class="screen"><span class="notch"></span><iframe id="app" src="mobile" title="cellsign.tech" allow="geolocation; vibrate" loading="eager"></iframe></div></div>
    <small data-i18n="l.phone.note"></small>
  </div>
</div></header>

<section id="citizen"><div class="wrap">
  <div class="reveal"><div class="kicker" data-i18n="l.nav.how"></div><h2 data-i18n="l.cit.h"></h2><p class="sub" data-i18n="l.cit.sub"></p></div>
  <div class="grid2">
    <div class="card reveal"><span class="ico" style="background:var(--crimson-50)"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#B50D33" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 18v-6a5 5 0 0 1 10 0v6M5 18h14v3H5zM12 2.5v2"/></svg></span><div><h3 data-i18n="l.c1.h"></h3><p data-i18n="l.c1.p"></p></div></div>
    <div class="card reveal"><span class="ico" style="background:var(--green-50)"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#006C49" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s7-6 7-11a7 7 0 0 0-14 0c0 5 7 11 7 11z"/><circle cx="12" cy="10" r="2.5"/></svg></span><div><h3 data-i18n="l.c2.h"></h3><p data-i18n="l.c2.p"></p></div></div>
    <div class="card reveal"><span class="ico" style="background:var(--soft)"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#313A51" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16v10H8l-4 4z"/></svg></span><div><h3 data-i18n="l.c3.h"></h3><p data-i18n="l.c3.p"></p></div></div>
    <div class="card reveal"><span class="ico" style="background:var(--violet-50)"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#43228A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.2a1.6 1.6 0 1 0 0 3.2 1.6 1.6 0 0 0 0-3.2zM11 8.5v5h5l2 5M8.6 10.6a5 5 0 1 0 6.6 7.2"/></svg></span><div><h3 data-i18n="l.c4.h"></h3><p data-i18n="l.c4.p"></p></div></div>
  </div>
</div></section>

<div class="night" id="dispatch"><div class="wrap two">
  <div class="reveal"><div class="kicker" data-i18n="l.nav.dispatch"></div><h2 data-i18n="l.disp.h"></h2><p class="sub" data-i18n="l.disp.p"></p>
    <ul class="checks">
      <li><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#2BC48A" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg><span data-i18n="l.disp.li1"></span></li>
      <li><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#2BC48A" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg><span data-i18n="l.disp.li2"></span></li>
      <li><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#2BC48A" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg><span data-i18n="l.disp.li3"></span></li>
    </ul>
  </div>
  <div class="ticket reveal" aria-hidden="true">
    <div class="h"><b data-i18n="d.redAlerts"></b><span data-i18n="l.t.zone"></span><span data-i18n="l.t.now"></span></div>
    <div class="t" data-i18n="alert.RED_DISPATCH_AND_OPEN_POINT"></div>
    <div class="s" data-i18n="l.t.sub"></div>
    <div class="plan"><div><i style="background:#5B9DFF"></i><span data-i18n="l.t.p1"></span></div><div><i style="background:#2BC48A"></i><span data-i18n="l.t.p2"></span></div></div>
    <button type="button" tabindex="-1" data-i18n="d.approve"></button>
  </div>
</div></div>

<section id="failures"><div class="wrap">
  <div class="reveal"><h2 data-i18n="l.res.h"></h2><p class="sub" data-i18n="l.res.p"></p></div>
  <ul class="fails reveal"><li data-i18n="l.r1"></li><li data-i18n="l.r2"></li><li data-i18n="l.r3"></li><li data-i18n="l.r4"></li><li data-i18n="l.r5"></li></ul>

  <h2 class="reveal" style="margin-top:88px" data-i18n="l.s.h"></h2>
  <div class="steps reveal">
    <div class="step"><h3 data-i18n="l.s1.h"></h3><p data-i18n="l.s1.p"></p></div>
    <div class="step"><h3 data-i18n="l.s2.h"></h3><p data-i18n="l.s2.p"></p></div>
    <div class="step"><h3 data-i18n="l.s3.h"></h3><p data-i18n="l.s3.p"></p></div>
  </div>
</div></section>

<section class="final"><div class="wrap reveal">
  <h2 data-i18n="l.f.h"></h2><p class="sub" data-i18n="l.f.p"></p>
  <div class="ctas"><a class="btn sos" href="mobile" data-i18n="l.cta.sos"></a><a class="btn ghost" href="dispatcher" data-i18n="l.cta.disp"></a></div>
</div></section>

<footer><div class="wrap"><span>cellsign.tech &copy; 2026, <span data-i18n="l.foot"></span></span><span><a href="brand.html" data-i18n="l.brand"></a><a href="api/docs" data-i18n="l.api"></a></span></div></footer>

<script type="module">
import { loadLang, state, tr } from './common.js';

const $ = (id) => document.getElementById(id);
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
const seg = $('langSeg');
function syncSeg() {
  let on = null;
  for (const b of seg.querySelectorAll('[data-l]')) { const sel = b.dataset.l === state.lang; b.setAttribute('aria-checked', String(sel)); if (sel) on = b; }
  const th = seg.querySelector('.thumb'); if (on) { th.style.width = `${on.offsetWidth}px`; th.style.transform = `translateX(${on.offsetLeft}px)`; }
}
async function setLang(l) {
  await loadLang(l); // fills every [data-i18n] from the shared az/en/ru dictionary
  document.title = tr('l.title'); syncSeg();
  // the phone runs the real app (same origin): switch it with its own animated language buttons
  try { $('app').contentDocument?.querySelector(`#langs [data-l="${l}"]`)?.click(); } catch { /* not loaded yet: it reads the same saved language */ }
}
seg.addEventListener('click', (e) => {
  const b = e.target.closest('[data-l]'); if (!b || b.dataset.l === state.lang) return;
  if (document.startViewTransition && !reduced) document.startViewTransition(() => setLang(b.dataset.l)); else setLang(b.dataset.l);
});
await setLang(localStorage.getItem('lang') || 'az');
document.fonts?.ready.then(syncSeg); addEventListener('resize', syncSeg);

// live numbers from the public API (the same data the citizen app uses)
try {
  const pts = (await (await fetch('api/points')).json()).filter((p) => p.active);
  if (pts.length) {
    const cap = pts.reduce((s, p) => s + p.capacity, 0); const occ = pts.reduce((s, p) => s + p.occupied, 0);
    $('sPoints').textContent = pts.length; $('sCap').textContent = cap.toLocaleString('en-US'); $('sFree').textContent = `${Math.round((1 - occ / cap) * 100)}%`;
  }
} catch { /* the static numbers stay */ }

const nav = $('nav');
addEventListener('scroll', () => nav.classList.toggle('scrolled', scrollY > 8), { passive: true });
const io = new IntersectionObserver((es) => es.forEach((e) => { if (e.isIntersecting) { e.target.classList.add('seen'); io.unobserve(e.target); } }), { rootMargin: '0px 0px -8% 0px' });
document.querySelectorAll('.reveal').forEach((el) => io.observe(el));
</script>
</body>
</html>
