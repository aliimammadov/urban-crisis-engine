services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      # CHANGE THESE before any public deployment (defaults are demo values)
      ADMIN_TOKEN: ${ADMIN_TOKEN:-admin-demo}
      DISPATCHER_TOKEN: ${DISPATCHER_TOKEN:-dispatcher-demo}
      OBSERVER_TOKEN: ${OBSERVER_TOKEN:-observer-demo}
      TOKEN_SECRET: ${TOKEN_SECRET:-}
      # set to 1 only when a trusted reverse proxy sets X-Forwarded-For
      TRUST_PROXY: ${TRUST_PROXY:-0}
    restart: unless-stopped
